STRUCTS:
  GoogleAppsDriveLabelsV2betaBadgeColors:
    - name: backgroundColor
      type: STRUCT(GoogleTypeColor)
      REQUIRED: false
      comment: Output only. Badge background that pairs with the foreground.
    - name: foregroundColor
      type: STRUCT(GoogleTypeColor)
      REQUIRED: false
      comment: Output only. Badge foreground that pairs with the background.
    - name: soloColor
      type: STRUCT(GoogleTypeColor)
      REQUIRED: false
      comment: Output only. Color that can be used for text without a background.
  GoogleTypeColor:
    - name: alpha
      type: FLOAT
      REQUIRED: false
      comment: "The fraction of this color that should be applied to the pixel. That is, the final pixel color is defined by the equation: `pixel color = alpha * (this color) + (1.0 - alpha) * (background color)` This means that a value of 1.0 corresponds to a solid color, whereas a value of 0.0 corresponds to a completely transparent color. This uses a wrapper message rather than a simple float scalar so that it is possible to distinguish between a default value and the value being unset. If omitted, this color object is rendered as a solid color (as if the alpha value had been explicitly given a value of 1.0)."
    - name: blue
      type: FLOAT
      REQUIRED: false
      comment: The amount of blue in the color as a value in the interval [0, 1].
    - name: green
      type: FLOAT
      REQUIRED: false
      comment: The amount of green in the color as a value in the interval [0, 1].
    - name: red
      type: FLOAT
      REQUIRED: false
      comment: The amount of red in the color as a value in the interval [0, 1].
  GoogleAppsDriveLabelsV2betaBadgeConfig:
    - name: color
      type: STRUCT(GoogleTypeColor)
      REQUIRED: false
      comment: The color of the badge. When not specified, no badge is rendered. The background, foreground, and solo (light and dark mode) colors set here are changed in the Drive UI into the closest recommended supported color.
    - name: priorityOverride
      type: STRING
      REQUIRED: false
      comment: Override the default global priority of this badge. When set to 0, the default priority heuristic is used.
  GoogleAppsDriveLabelsV2betaBatchDeleteLabelPermissionsRequest:
    - name: requests
      type: "[]STRUCT(GoogleAppsDriveLabelsV2betaDeleteLabelPermissionRequest)"
      REQUIRED: false
      comment: Required. The request message specifying the resources to update.
    - name: useAdminAccess
      type: BOOL
      REQUIRED: false
      comment: Set to `true` in order to use the user's admin credentials. The server will verify the user is an admin for the label before allowing access. If this is set, the `use_admin_access` field in the `DeleteLabelPermissionRequest` messages must either be empty or match this field.
  GoogleAppsDriveLabelsV2betaDeleteLabelPermissionRequest:
    - name: name
      type: STRING
      REQUIRED: false
      comment: Required. Label permission resource name.
    - name: useAdminAccess
      type: BOOL
      REQUIRED: false
      comment: Set to `true` in order to use the user's admin credentials. The server will verify the user is an admin for the label before allowing access.
  GoogleAppsDriveLabelsV2betaBatchUpdateLabelPermissionsRequest:
    - name: requests
      type: "[]STRUCT(GoogleAppsDriveLabelsV2betaUpdateLabelPermissionRequest)"
      REQUIRED: false
      comment: Required. The request message specifying the resources to update.
    - name: useAdminAccess
      type: BOOL
      REQUIRED: false
      comment: Set to `true` in order to use the user's admin credentials. The server will verify the user is an admin for the label before allowing access. If this is set, the `use_admin_access` field in the `UpdateLabelPermissionRequest` messages must either be empty or match this field.
  GoogleAppsDriveLabelsV2betaUpdateLabelPermissionRequest:
    - name: labelPermission
      type: STRUCT(GoogleAppsDriveLabelsV2betaLabelPermission)
      REQUIRED: false
      comment: Required. The permission to create or update on the label.
    - name: parent
      type: STRING
      REQUIRED: false
      comment: Required. The parent label resource name.
    - name: useAdminAccess
      type: BOOL
      REQUIRED: false
      comment: Set to `true` in order to use the user's admin credentials. The server will verify the user is an admin for the label before allowing access.
  GoogleAppsDriveLabelsV2betaLabelPermission:
    - name: audience
      type: STRING
      REQUIRED: false
      comment: Audience to grant a role to. The magic value of `audiences/default` may be used to apply the role to the default audience in the context of the organization that owns the label.
    - name: email
      type: STRING
      REQUIRED: false
      comment: Specifies the email address for a user or group principal. Not populated for audience principals. User and group permissions may only be inserted using an email address. On update requests, if email address is specified, no principal should be specified.
    - name: group
      type: STRING
      REQUIRED: false
      comment: Group resource name.
    - name: name
      type: STRING
      REQUIRED: false
      comment: Resource name of this permission.
    - name: person
      type: STRING
      REQUIRED: false
      comment: Person resource name.
    - name: role
      type: STRING
      REQUIRED: false
      comment: The role the principal should have.
  GoogleAppsDriveLabelsV2betaBatchUpdateLabelPermissionsResponse:
    - name: permissions
      type: "[]STRUCT(GoogleAppsDriveLabelsV2betaLabelPermission)"
      REQUIRED: false
      comment: Required. Permissions updated.
  GoogleAppsDriveLabelsV2betaDateLimits:
    - name: maxValue
      type: STRUCT(GoogleTypeDate)
      REQUIRED: false
      comment: Maximum value for the date field type.
    - name: minValue
      type: STRUCT(GoogleTypeDate)
      REQUIRED: false
      comment: Minimum value for the date field type.
  GoogleTypeDate:
    - name: day
      type: INT
      REQUIRED: false
      comment: Day of a month. Must be from 1 to 31 and valid for the year and month, or 0 to specify a year by itself or a year and month where the day isn't significant.
    - name: month
      type: INT
      REQUIRED: false
      comment: Month of a year. Must be from 1 to 12, or 0 to specify a year without a month and day.
    - name: year
      type: INT
      REQUIRED: false
      comment: Year of the date. Must be from 1 to 9999, or 0 to specify a date without a year.
  GoogleAppsDriveLabelsV2betaDeltaUpdateLabelRequest:
    - name: languageCode
