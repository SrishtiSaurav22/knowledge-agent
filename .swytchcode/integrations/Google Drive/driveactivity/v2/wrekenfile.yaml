VERSION: 2.0.2
DEFAULTS:
  bearer_token: BEARER <ACCESS_TOKEN>
  w_base_url: https://driveactivity.googleapis.com
METHODS:
  driveactivity.activityquery.create:
    SUMMARY: Query past activity in Google Drive.
    DESC: Query past activity in Google Drive.
    HTTP:
      METHOD: POST
      ENDPOINT: /v2/activity:query
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(QueryDriveActivityRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - oauth_token:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - upload_protocol:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - alt:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - fields:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - prettyPrint:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
      - uploadType:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - callback:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - key:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - access_token:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - $.xgafv:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - quotaUser:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - body:
          TYPE: STRUCT(QueryDriveActivityRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(QueryDriveActivityResponse)
        RETURNVAR: driveactivity_activityquery_create
        STATUS: 200
    CANONICAL_ID: driveactivity.activityquery.create
STRUCTS:
  Action:
    - name: actor
      type: STRUCT(Actor)
      REQUIRED: false
      comment: The actor responsible for this action (or empty if all actors are responsible).
    - name: detail
      type: STRUCT(ActionDetail)
      REQUIRED: false
      comment: The type and detailed information about the action.
    - name: target
      type: STRUCT(Target)
      REQUIRED: false
      comment: The target this action affects (or empty if affecting all targets). This represents the state of the target immediately after this action occurred.
    - name: timeRange
      type: STRUCT(TimeRange)
      REQUIRED: false
      comment: The action occurred over this time range.
    - name: timestamp
      type: STRING
      REQUIRED: false
      comment: The action occurred at this specific time.
  Actor:
    - name: administrator
      type: STRUCT(Administrator)
      REQUIRED: false
      comment: An administrator.
    - name: anonymous
      type: STRUCT(AnonymousUser)
      REQUIRED: false
      comment: An anonymous user.
    - name: impersonation
      type: STRUCT(Impersonation)
      REQUIRED: false
      comment: An account acting on behalf of another.
    - name: system
      type: STRUCT(SystemEvent)
      REQUIRED: false
      comment: A non-user actor (i.e. system triggered).
    - name: user
      type: STRUCT(User)
      REQUIRED: false
      comment: An end user.
  Impersonation:
    - name: impersonatedUser
      type: STRUCT(User)
      REQUIRED: false
      comment: The impersonated user.
  User:
    - name: deletedUser
      type: STRUCT(DeletedUser)
      REQUIRED: false
      comment: A user whose account has since been deleted.
    - name: knownUser
      type: STRUCT(KnownUser)
      REQUIRED: false
      comment: A known user.
    - name: unknownUser
      type: STRUCT(UnknownUser)
      REQUIRED: false
      comment: A user about whom nothing is currently known.
  KnownUser:
    - name: isCurrentUser
      type: BOOL
      REQUIRED: false
      comment: True if this is the user making the request.
    - name: personName
      type: STRING
      REQUIRED: false
      comment: The identifier for this user that can be used with the People API to get more information. The format is `people/ACCOUNT_ID`. See https://developers.google.com/people/.
  SystemEvent:
    - name: type
      type: STRING
      REQUIRED: false
      comment: The type of the system event that may triggered activity.
  ActionDetail:
    - name: appliedLabelChange
      type: STRUCT(AppliedLabelChange)
      REQUIRED: false
      comment: Label was changed.
    - name: comment
      type: STRUCT(Comment)
      REQUIRED: false
      comment: A change about comments was made.
    - name: create
      type: STRUCT(Create)
      REQUIRED: false
      comment: An object was created.
    - name: delete
      type: STRUCT(Delete)
      REQUIRED: false
      comment: An object was deleted.
    - name: dlpChange
      type: STRUCT(DataLeakPreventionChange)
      REQUIRED: false
      comment: A change happened in data leak prevention status.
    - name: edit
      type: STRUCT(Edit)
      REQUIRED: false
      comment: An object was edited.
    - name: move
      type: STRUCT(Move)
      REQUIRED: false
      comment: An object was moved.
    - name: permissionChange
      type: STRUCT(PermissionChange)
      REQUIRED: false
      comment: The permission on an object was changed.
    - name: reference
      type: STRUCT(ApplicationReference)
      REQUIRED: false
      comment: An object was referenced in an application outside of Drive/Docs.
    - name: rename
      type: STRUCT(Rename)
      REQUIRED: false
      comment: An object was renamed.
    - name: restore
      type: STRUCT(Restore)
      REQUIRED: false
      comment: A deleted object was restored.
    - name: settingsChange
      type: STRUCT(SettingsChange)
      REQUIRED: false
      comment: Settings were changed.
  AppliedLabelChange:
    - name: changes
      type: "[]STRUCT(AppliedLabelChangeDetail)"
      REQUIRED: false
      comment: Changes that were made to the Label on the Target.
  AppliedLabelChangeDetail:
    - name: fieldChanges
      type: "[]STRUCT(FieldValueChange)"
      REQUIRED: false
      comment: Field Changes. Only present if `types` contains `LABEL_FIELD_VALUE_CHANGED`.
    - name: label
      type: STRING
      REQUIRED: false
      comment: The Label name representing the Label that changed. This name always contains the revision of the Label that was used when this Action occurred. The format is `labels/id@revision`.
    - name: title
      type: STRING
      REQUIRED: false
      comment: The human-readable title of the label that changed.
    - name: types
      type: "[]STRING"
      REQUIRED: false
      comment: The types of changes made to the Label on the Target.
  FieldValueChange:
    - name: displayName
      type: STRING
      REQUIRED: false
      comment: The human-readable display name for this field.
    - name: fieldId
      type: STRING
      REQUIRED: false
      comment: The ID of this field. Field IDs are unique within a Label.
    - name: newValue
      type: STRUCT(FieldValue)
      REQUIRED: false
      comment: The value that is now set on the field. If not present, the field was cleared. At least one of {old_value|new_value} is always set.
    - name: oldValue
      type: STRUCT(FieldValue)
      REQUIRED: false
      comment: The value that was previously set on the field. If not present, the field was newly set. At least one of {old_value|new_value} is always set.
  FieldValue:
    - name: date
      type: STRUCT(Date)
      REQUIRED: false
      comment: Date Field value.
    - name: integer
      type: STRUCT(Integer)
      REQUIRED: false
      comment: Integer Field value.
    - name: selection
      type: STRUCT(Selection)
      REQUIRED: false
      comment: Selection Field value.
    - name: selectionList
      type: STRUCT(SelectionList)
      REQUIRED: false
      comment: Selection List Field value.
    - name: text
      type: STRUCT(Text)
      REQUIRED: false
      comment: Text Field value.
    - name: textList
      type: STRUCT(TextList)
      REQUIRED: false
      comment: Text List Field value.
    - name: user
      type: STRUCT(SingleUser)
      REQUIRED: false
      comment: User Field value.
    - name: userList
      type: STRUCT(UserList)
      REQUIRED: false
      comment: User List Field value.
  Date:
    - name: value
      type: STRING
      REQUIRED: false
      comment: Date value.
  Integer:
    - name: value
      type: STRING
      REQUIRED: false
      comment: Integer value.
  Selection:
    - name: displayName
      type: STRING
      REQUIRED: false
      comment: Selection value as human-readable display string.
    - name: value
      type: STRING
      REQUIRED: false
      comment: Selection value as Field Choice ID.
  SelectionList:
    - name: values
      type: "[]STRUCT(Selection)"
      REQUIRED: false
      comment: Selection values.
  Text:
    - name: value
      type: STRING
      REQUIRED: false
      comment: Value of Text Field.
  TextList:
    - name: values
      type: "[]STRUCT(Text)"
      REQUIRED: false
      comment: Text values.
  SingleUser:
    - name: value
      type: STRING
      REQUIRED: false
      comment: User value as email.
  UserList:
    - name: values
      type: "[]STRUCT(SingleUser)"
      REQUIRED: false
      comment: User values.
  Comment:
    - name: assignment
      type: STRUCT(Assignment)
      REQUIRED: false
      comment: A change on an assignment.
    - name: mentionedUsers
      type: "[]STRUCT(User)"
      REQUIRED: false
      comment: Users who are mentioned in this comment.
    - name: post
      type: STRUCT(Post)
      REQUIRED: false
      comment: A change on a regular posted comment.
    - name: suggestion
      type: STRUCT(Suggestion)
      REQUIRED: false
      comment: A change on a suggestion.
  Assignment:
    - name: assignedUser
      type: STRUCT(User)
      REQUIRED: false
      comment: The user to whom the comment was assigned.
    - name: subtype
      type: STRING
      REQUIRED: false
      comment: The sub-type of this event.
  Post:
    - name: subtype
      type: STRING
      REQUIRED: false
      comment: The sub-type of this event.
  Suggestion:
    - name: subtype
      type: STRING
      REQUIRED: false
      comment: The sub-type of this event.
  Create:
    - name: copy
      type: STRUCT(Copy)
      REQUIRED: false
      comment: If present, indicates the object was created by copying an existing Drive object.
    - name: new
      type: STRUCT(New)
      REQUIRED: false
      comment: If present, indicates the object was newly created (e.g. as a blank document), not derived from a Drive object or external object.
    - name: upload
      type: STRUCT(Upload)
      REQUIRED: false
      comment: If present, indicates the object originated externally and was uploaded to Drive.
  Copy:
    - name: originalObject
      type: STRUCT(TargetReference)
      REQUIRED: false
      comment: The original object.
  TargetReference:
    - name: drive
      type: STRUCT(DriveReference)
      REQUIRED: false
      comment: The target is a shared drive.
    - name: driveItem
      type: STRUCT(DriveItemReference)
      REQUIRED: false
      comment: The target is a Drive item.
    - name: teamDrive
      type: STRUCT(TeamDriveReference)
      REQUIRED: false
      comment: This field is deprecated; please use the `drive` field instead.
  DriveReference:
    - name: name
      type: STRING
      REQUIRED: false
      comment: The resource name of the shared drive. The format is `COLLECTION_ID/DRIVE_ID`. Clients should not assume a specific collection ID for this resource name.
    - name: title
      type: STRING
      REQUIRED: false
      comment: The title of the shared drive.
  DriveItemReference:
    - name: driveFile
      type: STRUCT(DriveFile)
      REQUIRED: false
      comment: The Drive item is a file.
    - name: driveFolder
      type: STRUCT(DriveFolder)
      REQUIRED: false
      comment: The Drive item is a folder. Includes information about the type of folder.
    - name: file
      type: STRUCT(File)
      REQUIRED: false
      comment: This field is deprecated; please use the `driveFile` field instead.
    - name: folder
      type: STRUCT(Folder)
      REQUIRED: false
      comment: This field is deprecated; please use the `driveFolder` field instead.
    - name: name
      type: STRING
      REQUIRED: false
      comment: The target Drive item. The format is `items/ITEM_ID`.
    - name: title
      type: STRING
      REQUIRED: false
      comment: The title of the Drive item.
  DriveFolder:
    - name: type
      type: STRING
      REQUIRED: false
      comment: The type of Drive folder.
  Folder:
    - name: type
      type: STRING
      REQUIRED: false
      comment: This field is deprecated; please see `DriveFolder.type` instead.
  TeamDriveReference:
    - name: name
      type: STRING
      REQUIRED: false
      comment: This field is deprecated; please see `DriveReference.name` instead.
    - name: title
      type: STRING
      REQUIRED: false
      comment: This field is deprecated; please see `DriveReference.title` instead.
  Delete:
    - name: type
      type: STRING
      REQUIRED: false
      comment: The type of delete action taken.
  DataLeakPreventionChange:
    - name: type
      type: STRING
      REQUIRED: false
      comment: The type of Data Leak Prevention (DLP) change.
  Move:
    - name: addedParents
      type: "[]STRUCT(TargetReference)"
      REQUIRED: false
      comment: The added parent object(s).
    - name: removedParents
      type: "[]STRUCT(TargetReference)"
      REQUIRED: false
      comment: The removed parent object(s).
  PermissionChange:
    - name: addedPermissions
      type: "[]STRUCT(Permission)"
      REQUIRED: false
      comment: The set of permissions added by this change.
    - name: removedPermissions
      type: "[]STRUCT(Permission)"
      REQUIRED: false
      comment: The set of permissions removed by this change.
  Permission:
    - name: allowDiscovery
      type: BOOL
      REQUIRED: false
      comment: If true, the item can be discovered (e.g. in the user's "Shared with me" collection) without needing a link to the item.
    - name: anyone
      type: STRUCT(Anyone)
      REQUIRED: false
      comment: If set, this permission applies to anyone, even logged out users.
    - name: domain
      type: STRUCT(Domain)
      REQUIRED: false
      comment: The domain to whom this permission applies.
    - name: group
      type: STRUCT(Group)
      REQUIRED: false
      comment: The group to whom this permission applies.
    - name: role
      type: STRING
      REQUIRED: false
      comment: Indicates the [Google Drive permissions role](https://developers.google.com/workspace/drive/web/manage-sharing#roles). The role determines a user's ability to read, write, and comment on items.
    - name: user
      type: STRUCT(User)
      REQUIRED: false
      comment: The user to whom this permission applies.
  Domain:
    - name: legacyId
      type: STRING
      REQUIRED: false
      comment: An opaque string used to identify this domain.
    - name: name
      type: STRING
      REQUIRED: false
      comment: The name of the domain, e.g. `google.com`.
  Group:
    - name: email
      type: STRING
      REQUIRED: false
      comment: The email address of the group.
    - name: title
      type: STRING
      REQUIRED: false
      comment: The title of the group.
  ApplicationReference:
    - name: type
      type: STRING
      REQUIRED: false
      comment: The reference type corresponding to this event.
  Rename:
    - name: newTitle
      type: STRING
      REQUIRED: false
      comment: The new title of the drive object.
    - name: oldTitle
      type: STRING
      REQUIRED: false
      comment: The previous title of the drive object.
  Restore:
    - name: type
      type: STRING
      REQUIRED: false
      comment: The type of restore action taken.
  SettingsChange:
    - name: restrictionChanges
      type: "[]STRUCT(RestrictionChange)"
      REQUIRED: false
      comment: The set of changes made to restrictions.
  RestrictionChange:
    - name: feature
      type: STRING
      REQUIRED: false
      comment: The feature which had a change in restriction policy.
    - name: newRestriction
      type: STRING
      REQUIRED: false
      comment: The restriction in place after the change.
  Target:
    - name: drive
      type: STRUCT(Drive)
      REQUIRED: false
      comment: The target is a shared drive.
    - name: driveItem
      type: STRUCT(DriveItem)
      REQUIRED: false
      comment: The target is a Drive item.
    - name: fileComment
      type: STRUCT(FileComment)
      REQUIRED: false
      comment: The target is a comment on a Drive file.
    - name: teamDrive
      type: STRUCT(TeamDrive)
      REQUIRED: false
      comment: This field is deprecated; please use the `drive` field instead.
  Drive:
    - name: name
      type: STRING
      REQUIRED: false
      comment: The resource name of the shared drive. The format is `COLLECTION_ID/DRIVE_ID`. Clients should not assume a specific collection ID for this resource name.
    - name: root
      type: STRUCT(DriveItem)
      REQUIRED: false
      comment: The root of this shared drive.
    - name: title
      type: STRING
      REQUIRED: false
      comment: The title of the shared drive.
  DriveItem:
    - name: driveFile
      type: STRUCT(DriveFile)
      REQUIRED: false
      comment: The Drive item is a file.
    - name: driveFolder
      type: STRUCT(DriveFolder)
      REQUIRED: false
      comment: The Drive item is a folder. Includes information about the type of folder.
    - name: file
      type: STRUCT(File)
      REQUIRED: false
      comment: This field is deprecated; please use the `driveFile` field instead.
    - name: folder
      type: STRUCT(Folder)
      REQUIRED: false
      comment: This field is deprecated; please use the `driveFolder` field instead.
    - name: mimeType
      type: STRING
      REQUIRED: false
      comment: The MIME type of the Drive item. See https://developers.google.com/workspace/drive/v3/web/mime-types.
    - name: name
      type: STRING
      REQUIRED: false
      comment: The target Drive item. The format is `items/ITEM_ID`.
    - name: owner
      type: STRUCT(Owner)
      REQUIRED: false
      comment: Information about the owner of this Drive item.
    - name: title
      type: STRING
      REQUIRED: false
      comment: The title of the Drive item.
  Owner:
    - name: domain
      type: STRUCT(Domain)
      REQUIRED: false
      comment: The domain of the Drive item owner.
    - name: drive
      type: STRUCT(DriveReference)
      REQUIRED: false
      comment: The drive that owns the item.
    - name: teamDrive
      type: STRUCT(TeamDriveReference)
      REQUIRED: false
      comment: This field is deprecated; please use the `drive` field instead.
    - name: user
      type: STRUCT(User)
      REQUIRED: false
      comment: The user that owns the Drive item.
  FileComment:
    - name: legacyCommentId
      type: STRING
      REQUIRED: false
      comment: The comment in the discussion thread. This identifier is an opaque string compatible with the Drive API; see https://developers.google.com/workspace/drive/v3/reference/comments/get
    - name: legacyDiscussionId
      type: STRING
      REQUIRED: false
      comment: The discussion thread to which the comment was added. This identifier is an opaque string compatible with the Drive API and references the first comment in a discussion; see https://developers.google.com/workspace/drive/v3/reference/comments/get
    - name: linkToDiscussion
      type: STRING
      REQUIRED: false
      comment: The link to the discussion thread containing this comment, for example, `https://docs.google.com/DOCUMENT_ID/edit?disco=THREAD_ID`.
    - name: parent
      type: STRUCT(DriveItem)
      REQUIRED: false
      comment: The Drive item containing this comment.
  TeamDrive:
    - name: name
      type: STRING
      REQUIRED: false
      comment: This field is deprecated; please see `Drive.name` instead.
    - name: root
      type: STRUCT(DriveItem)
      REQUIRED: false
      comment: This field is deprecated; please see `Drive.root` instead.
    - name: title
      type: STRING
      REQUIRED: false
      comment: This field is deprecated; please see `Drive.title` instead.
  TimeRange:
    - name: endTime
      type: STRING
      REQUIRED: false
      comment: The end of the time range.
    - name: startTime
      type: STRING
      REQUIRED: false
      comment: The start of the time range.
  ConsolidationStrategy:
    - name: legacy
      type: STRUCT(Legacy)
      REQUIRED: false
      comment: The individual activities are consolidated using the legacy strategy.
    - name: none
      type: STRUCT(NoConsolidation)
      REQUIRED: false
      comment: The individual activities are not consolidated.
  DriveActivity:
    - name: actions
      type: "[]STRUCT(Action)"
      REQUIRED: false
      comment: Details on all actions in this activity.
    - name: actors
      type: "[]STRUCT(Actor)"
      REQUIRED: false
      comment: All actor(s) responsible for the activity.
    - name: primaryActionDetail
      type: STRUCT(ActionDetail)
      REQUIRED: false
      comment: Key information about the primary action for this activity. This is either representative, or the most important, of all actions in the activity, according to the ConsolidationStrategy in the request.
    - name: targets
      type: "[]STRUCT(Target)"
      REQUIRED: false
      comment: All Google Drive objects this activity is about (e.g. file, folder, drive). This represents the state of the target immediately after the actions occurred.
    - name: timeRange
      type: STRUCT(TimeRange)
      REQUIRED: false
      comment: The activity occurred over this time range.
    - name: timestamp
      type: STRING
      REQUIRED: false
      comment: The activity occurred at this specific time.
  QueryDriveActivityRequest:
    - name: ancestorName
      type: STRING
      REQUIRED: false
      comment: Return activities for this Drive folder, plus all children and descendants. The format is `items/ITEM_ID`.
    - name: consolidationStrategy
      type: STRUCT(ConsolidationStrategy)
      REQUIRED: false
      comment: Details on how to consolidate related actions that make up the activity. If not set, then related actions aren't consolidated.
    - name: filter
      type: STRING
      REQUIRED: false
      comment: "The filtering for items returned from this query request. The format of the filter string is a sequence of expressions, joined by an optional \"AND\", where each expression is of the form \"field operator value\". Supported fields: - `time`: Uses numerical operators on date values either in terms of milliseconds since Jan 1, 1970 or in RFC 3339 format. Examples: - `time > 1452409200000 AND time <= 1492812924310` - `time >= \"2016-01-10T01:02:03-05:00\"` - `detail.action_detail_case`: Uses the \"has\" operator (:) and either a singular value or a list of allowed action types enclosed in parentheses, separated by a space. To exclude a result from the response, prepend a hyphen (`-`) to the beginning of the filter string. Examples: - `detail.action_detail_case:RENAME` - `detail.action_detail_case:(CREATE RESTORE)` - `-detail.action_detail_case:MOVE` "
    - name: itemName
      type: STRING
      REQUIRED: false
      comment: Return activities for this Drive item. The format is `items/ITEM_ID`.
    - name: pageSize
      type: INT
      REQUIRED: false
      comment: The minimum number of activities desired in the response; the server attempts to return at least this quantity. The server may also return fewer activities if it has a partial response ready before the request times out. If not set, a default value is used.
    - name: pageToken
      type: STRING
      REQUIRED: false
      comment: The token identifies which page of results to return. Set this to the next_page_token value returned from a previous query to obtain the following page of results. If not set, the first page of results is returned.
  QueryDriveActivityResponse:
    - name: activities
      type: "[]STRUCT(DriveActivity)"
      REQUIRED: false
      comment: List of activity requested.
    - name: nextPageToken
      type: STRING
      REQUIRED: false
      comment: Token to retrieve the next page of results, or empty if there are no more results in the list.
