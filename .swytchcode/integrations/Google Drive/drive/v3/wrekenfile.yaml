STRUCTS:
  About:
    - name: appInstalled
      type: BOOL
      REQUIRED: false
      comment: Whether the user has installed the requesting app.
    - name: canCreateDrives
      type: BOOL
      REQUIRED: false
      comment: Whether the user can create shared drives.
    - name: canCreateTeamDrives
      type: BOOL
      REQUIRED: false
      comment: "Deprecated: Use `canCreateDrives` instead."
    - name: driveThemes
      type: "[]ANY"
      REQUIRED: false
      comment: A list of themes that are supported for shared drives.
    - name: exportFormats
      type: map[STRING]ANY
      REQUIRED: false
      comment: A map of source MIME type to possible targets for all supported exports.
    - name: folderColorPalette
      type: "[]STRING"
      REQUIRED: false
      comment: The currently supported folder colors as RGB hex strings.
    - name: importFormats
      type: map[STRING]ANY
      REQUIRED: false
      comment: A map of source MIME type to possible targets for all supported imports.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: "Identifies what kind of resource this is. Value: the fixed string `\"drive#about\"`."
    - name: maxImportSizes
      type: map[STRING]STRING
      REQUIRED: false
      comment: A map of maximum import sizes by MIME type, in bytes.
    - name: maxUploadSize
      type: STRING
      REQUIRED: false
      comment: The maximum upload size in bytes.
    - name: storageQuota
      type: OBJECT
      REQUIRED: false
      comment: The user's storage quota limits and usage. For users that are part of an organization with pooled storage, information about the limit and usage across all services is for the organization, rather than the individual user. All fields are measured in bytes.
    - name: teamDriveThemes
      type: "[]ANY"
      REQUIRED: false
      comment: "Deprecated: Use `driveThemes` instead."
    - name: user
      type: STRUCT(User)
      REQUIRED: false
      comment: The authenticated user.
  User:
    - name: displayName
      type: STRING
      REQUIRED: false
      comment: Output only. A plain text displayable name for this user.
    - name: emailAddress
      type: STRING
      REQUIRED: false
      comment: Output only. The email address of the user. This may not be present in certain contexts if the user has not made their email address visible to the requester.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: "Output only. Identifies what kind of resource this is. Value: the fixed string `drive#user`."
    - name: me
      type: BOOL
      REQUIRED: false
      comment: Output only. Whether this user is the requesting user.
    - name: permissionId
      type: STRING
      REQUIRED: false
      comment: Output only. The user's ID as visible in Permission resources.
    - name: photoLink
      type: STRING
      REQUIRED: false
      comment: Output only. A link to the user's profile photo, if available.
  AccessProposal:
    - name: createTime
      type: STRING
      REQUIRED: false
      comment: The creation time.
    - name: fileId
      type: STRING
      REQUIRED: false
      comment: The file ID that the proposal for access is on.
    - name: proposalId
      type: STRING
      REQUIRED: false
      comment: The ID of the access proposal.
    - name: recipientEmailAddress
      type: STRING
      REQUIRED: false
      comment: The email address of the user that will receive permissions, if accepted.
    - name: requestMessage
      type: STRING
      REQUIRED: false
      comment: The message that the requester added to the proposal.
    - name: requesterEmailAddress
      type: STRING
      REQUIRED: false
      comment: The email address of the requesting user.
    - name: rolesAndViews
      type: "[]STRUCT(AccessProposalRoleAndView)"
      REQUIRED: false
      comment: A wrapper for the role and view of an access proposal. For more information, see [Roles and permissions](https://developers.google.com/workspace/drive/api/guides/ref-roles).
  AccessProposalRoleAndView:
    - name: role
      type: STRING
      REQUIRED: false
      comment: "The role that was proposed by the requester. The supported values are: * `writer` * `commenter` * `reader`"
    - name: view
      type: STRING
      REQUIRED: false
      comment: Indicates the view for this access proposal. Only populated for proposals that belong to a view. Only `published` is supported.
  AddReviewer:
    - name: addedReviewerEmail
      type: STRING
      REQUIRED: false
      comment: Required. The email of the reviewer to add.
  App:
    - name: authorized
      type: BOOL
      REQUIRED: false
      comment: Whether the app is authorized to access data on the user's Drive.
    - name: createInFolderTemplate
      type: STRING
      REQUIRED: false
      comment: The template URL to create a file with this app in a given folder. The template contains the {folderId} to be replaced by the folder ID house the new file.
    - name: createUrl
      type: STRING
      REQUIRED: false
      comment: The URL to create a file with this app.
    - name: hasDriveWideScope
      type: BOOL
      REQUIRED: false
      comment: Whether the app has Drive-wide scope. An app with Drive-wide scope can access all files in the user's Drive.
    - name: icons
      type: "[]STRUCT(AppIcons)"
      REQUIRED: false
      comment: The various icons for the app.
    - name: id
      type: STRING
      REQUIRED: false
      comment: The ID of the app.
    - name: installed
      type: BOOL
      REQUIRED: false
      comment: Whether the app is installed.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: "Output only. Identifies what kind of resource this is. Value: the fixed string \"drive#app\"."
    - name: longDescription
      type: STRING
      REQUIRED: false
      comment: A long description of the app.
    - name: name
      type: STRING
      REQUIRED: false
      comment: The name of the app.
    - name: objectType
      type: STRING
      REQUIRED: false
      comment: The type of object this app creates such as a Chart. If empty, the app name should be used instead.
    - name: openUrlTemplate
      type: STRING
      REQUIRED: false
      comment: The template URL for opening files with this app. The template contains {ids} or {exportIds} to be replaced by the actual file IDs. For more information, see Open Files for the full documentation.
    - name: primaryFileExtensions
      type: "[]STRING"
      REQUIRED: false
      comment: The list of primary file extensions.
    - name: primaryMimeTypes
      type: "[]STRING"
      REQUIRED: false
      comment: The list of primary MIME types.
    - name: productId
      type: STRING
      REQUIRED: false
      comment: The ID of the product listing for this app.
    - name: productUrl
      type: STRING
      REQUIRED: false
      comment: A link to the product listing for this app.
    - name: secondaryFileExtensions
      type: "[]STRING"
      REQUIRED: false
      comment: The list of secondary file extensions.
    - name: secondaryMimeTypes
      type: "[]STRING"
      REQUIRED: false
      comment: The list of secondary MIME types.
    - name: shortDescription
      type: STRING
      REQUIRED: false
      comment: A short description of the app.
    - name: supportsCreate
      type: BOOL
      REQUIRED: false
      comment: Whether this app supports creating objects.
    - name: supportsImport
      type: BOOL
      REQUIRED: false
      comment: Whether this app supports importing from Google Docs.
    - name: supportsMultiOpen
      type: BOOL
      REQUIRED: false
      comment: Whether this app supports opening more than one file.
    - name: supportsOfflineCreate
      type: BOOL
      REQUIRED: false
      comment: Whether this app supports creating files when offline.
    - name: useByDefault
      type: BOOL
      REQUIRED: false
      comment: Whether the app is selected as the default handler for the types it supports.
  AppIcons:
    - name: category
      type: STRING
      REQUIRED: false
      comment: "Category of the icon. Allowed values are: * `application` - The icon for the application. * `document` - The icon for a file associated with the app. * `documentShared` - The icon for a shared file associated with the app."
    - name: iconUrl
      type: STRING
      REQUIRED: false
      comment: URL for the icon.
    - name: size
      type: INT
      REQUIRED: false
      comment: Size of the icon. Represented as the maximum of the width and height.
  AppList:
    - name: defaultAppIds
      type: "[]STRING"
      REQUIRED: false
      comment: The list of app IDs that the user has specified to use by default. The list is in reverse-priority order (lowest to highest).
    - name: items
      type: "[]STRUCT(App)"
      REQUIRED: false
      comment: The list of apps.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: "Output only. Identifies what kind of resource this is. Value: the fixed string \"drive#appList\"."
    - name: selfLink
      type: STRING
      REQUIRED: false
      comment: A link back to this list.
  Approval:
    - name: approvalId
      type: STRING
      REQUIRED: false
      comment: The approval ID.
    - name: completeTime
      type: STRING
      REQUIRED: false
      comment: Output only. The time the approval was completed.
    - name: createTime
      type: STRING
      REQUIRED: false
      comment: Output only. The time the approval was created.
    - name: dueTime
      type: STRING
      REQUIRED: false
      comment: The time that the approval is due.
    - name: initiator
      type: STRUCT(User)
      REQUIRED: false
      comment: The user that requested the approval.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: This is always drive#approval.
    - name: modifyTime
      type: STRING
      REQUIRED: false
      comment: Output only. The most recent time the approval was modified.
    - name: reviewerResponses
      type: "[]STRUCT(ReviewerResponse)"
      REQUIRED: false
      comment: The responses made on the approval by reviewers.
    - name: status
      type: STRING
      REQUIRED: false
      comment: Output only. The status of the approval at the time this resource was requested.
    - name: targetFileId
      type: STRING
      REQUIRED: false
      comment: Target file id of the approval.
  ReviewerResponse:
    - name: kind
      type: STRING
      REQUIRED: false
      comment: This is always drive#reviewerResponse.
    - name: response
      type: STRING
      REQUIRED: false
      comment: A reviewer’s response for the approval.
    - name: reviewer
      type: STRUCT(User)
      REQUIRED: false
      comment: The user that's responsible for this response.
  ApprovalList:
    - name: items
      type: "[]STRUCT(Approval)"
      REQUIRED: false
      comment: The list of approvals. If `nextPageToken` is populated, then this list may be incomplete and an additional page of results should be fetched.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: This is always drive#approvalList
    - name: nextPageToken
      type: STRING
      REQUIRED: false
      comment: The page token for the next page of approvals. This is absent if the end of the approvals list has been reached. If the token is rejected for any reason, it should be discarded, and pagination should be restarted from the first page of results.
  ApproveApprovalRequest:
    - name: message
      type: STRING
      REQUIRED: false
      comment: Optional. A message to accompany the reviewer response on the approval. This message is included in notifications for the action and in the approval activity log.
  CancelApprovalRequest:
    - name: message
      type: STRING
      REQUIRED: false
      comment: Optional. A message to accompany the cancellation of the approval. This message is included in notifications for the action and in the approval activity log.
  Change:
    - name: changeType
      type: STRING
      REQUIRED: false
      comment: The type of the change. Possible values are `file` and `drive`.
    - name: drive
      type: STRUCT(Drive)
      REQUIRED: false
      comment: The updated state of the shared drive. Present if the changeType is drive, the user is still a member of the shared drive, and the shared drive has not been deleted.
    - name: driveId
      type: STRING
      REQUIRED: false
      comment: The ID of the shared drive associated with this change.
    - name: file
      type: STRUCT(File)
      REQUIRED: false
      comment: The updated state of the file. Present if the type is file and the file has not been removed from this list of changes.
    - name: fileId
      type: STRING
      REQUIRED: false
      comment: The ID of the file which has changed.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: "Identifies what kind of resource this is. Value: the fixed string `\"drive#change\"`."
    - name: removed
      type: BOOL
      REQUIRED: false
      comment: Whether the file or shared drive has been removed from this list of changes, for example by deletion or loss of access.
    - name: teamDrive
      type: STRUCT(TeamDrive)
      REQUIRED: false
      comment: "Deprecated: Use `drive` instead."
    - name: teamDriveId
      type: STRING
      REQUIRED: false
      comment: "Deprecated: Use `driveId` instead."
    - name: time
      type: TIMESTAMP
      REQUIRED: false
      comment: The time of this change (RFC 3339 date-time).
    - name: type
      type: STRING
      REQUIRED: false
      comment: "Deprecated: Use `changeType` instead."
  Drive:
    - name: backgroundImageFile
      type: OBJECT
      REQUIRED: false
      comment: An image file and cropping parameters from which a background image for this shared drive is set. This is a write only field; it can only be set on `drive.drives.update` requests that don't set `themeId`. When specified, all fields of the `backgroundImageFile` must be set.
    - name: backgroundImageLink
      type: STRING
      REQUIRED: false
      comment: Output only. A short-lived link to this shared drive's background image.
    - name: capabilities
      type: OBJECT
      REQUIRED: false
      comment: Output only. Capabilities the current user has on this shared drive.
    - name: colorRgb
      type: STRING
      REQUIRED: false
      comment: The color of this shared drive as an RGB hex string. It can only be set on a `drive.drives.update` request that does not set `themeId`.
    - name: createdTime
      type: TIMESTAMP
      REQUIRED: false
      comment: The time at which the shared drive was created (RFC 3339 date-time).
    - name: hidden
      type: BOOL
      REQUIRED: false
      comment: Whether the shared drive is hidden from default view.
    - name: id
      type: STRING
      REQUIRED: false
      comment: Output only. The ID of this shared drive which is also the ID of the top level folder of this shared drive.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: "Output only. Identifies what kind of resource this is. Value: the fixed string `\"drive#drive\"`."
    - name: name
      type: STRING
      REQUIRED: false
      comment: The name of this shared drive.
    - name: orgUnitId
      type: STRING
      REQUIRED: false
      comment: Output only. The organizational unit of this shared drive. This field is only populated on `drives.list` responses when the `useDomainAdminAccess` parameter is set to `true`.
    - name: restrictions
      type: OBJECT
      REQUIRED: false
      comment: A set of restrictions that apply to this shared drive or items inside this shared drive. Note that restrictions can't be set when creating a shared drive. To add a restriction, first create a shared drive and then use `drives.update` to add restrictions.
    - name: themeId
      type: STRING
      REQUIRED: false
      comment: The ID of the theme from which the background image and color will be set. The set of possible `driveThemes` can be retrieved from a `drive.about.get` response. When not specified on a `drive.drives.create` request, a random theme is chosen from which the background image and color are set. This is a write-only field; it can only be set on requests that don't set `colorRgb` or `backgroundImageFile`.
  DownloadRestriction:
    - name: restrictedForReaders
      type: BOOL
      REQUIRED: false
      comment: Whether download and copy is restricted for readers.
    - name: restrictedForWriters
      type: BOOL
      REQUIRED: false
      comment: Whether download and copy is restricted for writers. If true, download is also restricted for readers.
  File:
    - name: appProperties
      type: map[STRING]STRING
      REQUIRED: false
      comment: |-
        A collection of arbitrary key-value pairs which are private to the requesting app.
        Entries with null values are cleared in update and copy requests. These properties can only be retrieved using an authenticated request. An authenticated request uses an access token obtained with a OAuth 2 client ID. You cannot use an API key to retrieve private properties.
    - name: capabilities
      type: OBJECT
      REQUIRED: false
      comment: Output only. Capabilities the current user has on this file. Each capability corresponds to a fine-grained action that a user may take. For more information, see [Understand file capabilities](https://developers.google.com/workspace/drive/api/guides/manage-sharing#capabilities).
    - name: clientEncryptionDetails
      type: STRUCT(ClientEncryptionDetails)
      REQUIRED: false
      comment: Client Side Encryption related details. Contains details about the encryption state of the file and details regarding the encryption mechanism that clients need to use when decrypting the contents of this item. This will only be present on files and not on folders or shortcuts.
    - name: contentHints
      type: OBJECT
      REQUIRED: false
      comment: Additional information about the content of the file. These fields are never populated in responses.
    - name: contentRestrictions
      type: "[]STRUCT(ContentRestriction)"
      REQUIRED: false
      comment: Restrictions for accessing the content of the file. Only populated if such a restriction exists.
    - name: copyRequiresWriterPermission
      type: BOOL
      REQUIRED: false
      comment: Whether the options to copy, print, or download this file should be disabled for readers and commenters.
    - name: createdTime
      type: TIMESTAMP
      REQUIRED: false
      comment: The time at which the file was created (RFC 3339 date-time).
    - name: description
      type: STRING
      REQUIRED: false
      comment: A short description of the file.
    - name: downloadRestrictions
      type: STRUCT(DownloadRestrictionsMetadata)
      REQUIRED: false
      comment: Download restrictions applied on the file.
    - name: driveId
      type: STRING
      REQUIRED: false
      comment: Output only. ID of the shared drive the file resides in. Only populated for items in shared drives.
    - name: explicitlyTrashed
      type: BOOL
      REQUIRED: false
      comment: Output only. Whether the file has been explicitly trashed, as opposed to recursively trashed from a parent folder.
    - name: exportLinks
      type: map[STRING]STRING
      REQUIRED: false
      comment: Output only. Links for exporting Docs Editors files to specific formats.
    - name: fileExtension
      type: STRING
      REQUIRED: false
      comment: Output only. The final component of `fullFileExtension`. This is only available for files with binary content in Google Drive.
    - name: folderColorRgb
      type: STRING
      REQUIRED: false
      comment: The color for a folder or a shortcut to a folder as an RGB hex string. The supported colors are published in the `folderColorPalette` field of the [`about`](/workspace/drive/api/reference/rest/v3/about) resource. If an unsupported color is specified, the closest color in the palette is used instead.
    - name: fullFileExtension
      type: STRING
      REQUIRED: false
      comment: Output only. The full file extension extracted from the `name` field. May contain multiple concatenated extensions, such as "tar.gz". This is only available for files with binary content in Google Drive. This is automatically updated when the `name` field changes, however it's not cleared if the new name doesn't contain a valid extension.
    - name: hasAugmentedPermissions
      type: BOOL
      REQUIRED: false
      comment: Output only. Whether there are permissions directly on this file. This field is only populated for items in shared drives.
    - name: hasThumbnail
      type: BOOL
      REQUIRED: false
      comment: Output only. Whether this file has a thumbnail. This doesn't indicate whether the requesting app has access to the thumbnail. To check access, look for the presence of the thumbnailLink field.
    - name: headRevisionId
      type: STRING
      REQUIRED: false
      comment: Output only. The ID of the file's head revision. This is currently only available for files with binary content in Google Drive.
    - name: iconLink
      type: STRING
      REQUIRED: false
      comment: Output only. A static, unauthenticated link to the file's icon.
    - name: id
      type: STRING
      REQUIRED: false
      comment: The ID of the file.
    - name: imageMediaMetadata
      type: OBJECT
      REQUIRED: false
      comment: Output only. Additional metadata about image media, if available.
    - name: inheritedPermissionsDisabled
      type: BOOL
      REQUIRED: false
      comment: Whether this file has inherited permissions disabled. Inherited permissions are enabled by default.
    - name: isAppAuthorized
      type: BOOL
      REQUIRED: false
      comment: Output only. Whether the file was created or opened by the requesting app.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: "Output only. Identifies what kind of resource this is. Value: the fixed string `\"drive#file\"`."
    - name: labelInfo
      type: OBJECT
      REQUIRED: false
      comment: Label information on the file.
    - name: lastModifyingUser
      type: STRUCT(User)
      REQUIRED: false
      comment: Output only. The last user to modify the file. This field is only populated when the last modification was performed by a signed-in user.
    - name: linkShareMetadata
      type: OBJECT
      REQUIRED: false
      comment: Contains details about the link URLs that clients are using to refer to this item.
    - name: md5Checksum
      type: STRING
      REQUIRED: false
      comment: Output only. The MD5 checksum for the content of the file. This is only applicable to files with binary content in Google Drive.
    - name: mimeType
      type: STRING
      REQUIRED: false
      comment: The MIME type of the file. Google Drive attempts to automatically detect an appropriate value from uploaded content, if no value is provided. The value cannot be changed unless a new revision is uploaded. If a file is created with a Google Doc MIME type, the uploaded content is imported, if possible. The supported import formats are published in the [`about`](/workspace/drive/api/reference/rest/v3/about) resource.
    - name: modifiedByMe
      type: BOOL
      REQUIRED: false
      comment: Output only. Whether the file has been modified by this user.
    - name: modifiedByMeTime
      type: TIMESTAMP
      REQUIRED: false
      comment: The last time the file was modified by the user (RFC 3339 date-time).
    - name: modifiedTime
      type: TIMESTAMP
      REQUIRED: false
      comment: he last time the file was modified by anyone (RFC 3339 date-time). Note that setting modifiedTime will also update modifiedByMeTime for the user.
    - name: name
      type: STRING
      REQUIRED: false
      comment: The name of the file. This isn't necessarily unique within a folder. Note that for immutable items such as the top-level folders of shared drives, the My Drive root folder, and the Application Data folder, the name is constant.
    - name: originalFilename
      type: STRING
      REQUIRED: false
      comment: The original filename of the uploaded content if available, or else the original value of the `name` field. This is only available for files with binary content in Google Drive.
    - name: ownedByMe
      type: BOOL
      REQUIRED: false
      comment: Output only. Whether the user owns the file. Not populated for items in shared drives.
    - name: owners
      type: "[]STRUCT(User)"
      REQUIRED: false
      comment: Output only. The owner of this file. Only certain legacy files may have more than one owner. This field isn't populated for items in shared drives.
    - name: parents
      type: "[]STRING"
      REQUIRED: false
      comment: The ID of the parent folder containing the file. A file can only have one parent folder; specifying multiple parents isn't supported. If not specified as part of a create request, the file is placed directly in the user's My Drive folder. If not specified as part of a copy request, the file inherits any discoverable parent of the source file. Update requests must use the `addParents` and `removeParents` parameters to modify the parents list.
    - name: permissionIds
      type: "[]STRING"
      REQUIRED: false
      comment: Output only. List of permission IDs for users with access to this file.
    - name: permissions
      type: "[]STRUCT(Permission)"
      REQUIRED: false
      comment: Output only. The full list of permissions for the file. This is only available if the requesting user can share the file. Not populated for items in shared drives.
    - name: properties
      type: map[STRING]STRING
      REQUIRED: false
      comment: |-
        A collection of arbitrary key-value pairs which are visible to all apps.
        Entries with null values are cleared in update and copy requests.
    - name: quotaBytesUsed
      type: STRING
      REQUIRED: false
      comment: Output only. The number of storage quota bytes used by the file. This includes the head revision as well as previous revisions with `keepForever` enabled.
    - name: resourceKey
      type: STRING
      REQUIRED: false
      comment: Output only. A key needed to access the item via a shared link.
    - name: sha1Checksum
      type: STRING
      REQUIRED: false
      comment: Output only. The SHA1 checksum associated with this file, if available. This field is only populated for files with content stored in Google Drive; it's not populated for Docs Editors or shortcut files.
    - name: sha256Checksum
      type: STRING
      REQUIRED: false
      comment: Output only. The SHA256 checksum associated with this file, if available. This field is only populated for files with content stored in Google Drive; it's not populated for Docs Editors or shortcut files.
    - name: shared
      type: BOOL
      REQUIRED: false
      comment: Output only. Whether the file has been shared. Not populated for items in shared drives.
    - name: sharedWithMeTime
      type: TIMESTAMP
      REQUIRED: false
      comment: The time at which the file was shared with the user, if applicable (RFC 3339 date-time).
    - name: sharingUser
      type: STRUCT(User)
      REQUIRED: false
      comment: Output only. The user who shared the file with the requesting user, if applicable.
    - name: shortcutDetails
      type: OBJECT
      REQUIRED: false
      comment: Information about a shortcut file.
    - name: size
      type: STRING
      REQUIRED: false
      comment: Output only. Size in bytes of blobs and Google Workspace editor files. Won't be populated for files that have no size, like shortcuts and folders.
    - name: spaces
      type: "[]STRING"
      REQUIRED: false
      comment: Output only. The list of spaces which contain the file. The currently supported values are `drive`, `appDataFolder`, and `photos`.
    - name: starred
      type: BOOL
      REQUIRED: false
      comment: Whether the user has starred the file.
    - name: teamDriveId
      type: STRING
      REQUIRED: false
      comment: "Deprecated: Output only. Use `driveId` instead."
    - name: thumbnailLink
      type: STRING
      REQUIRED: false
      comment: Output only. A short-lived link to the file's thumbnail, if available. Typically lasts on the order of hours. Not intended for direct usage on web applications due to [Cross-Origin Resource Sharing (CORS)](https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS) policies. Consider using a proxy server. Only populated when the requesting app can access the file's content. If the file isn't shared publicly, the URL returned in `files.thumbnailLink` must be fetched using a credentialed request.
    - name: thumbnailVersion
      type: STRING
      REQUIRED: false
      comment: Output only. The thumbnail version for use in thumbnail cache invalidation.
    - name: trashed
      type: BOOL
      REQUIRED: false
      comment: Whether the file has been trashed, either explicitly or from a trashed parent folder. Only the owner may trash a file, but other users can still access the file in the owner's trash until it's permanently deleted.
    - name: trashedTime
      type: TIMESTAMP
      REQUIRED: false
      comment: The time that the item was trashed (RFC 3339 date-time). Only populated for items in shared drives.
    - name: trashingUser
      type: STRUCT(User)
      REQUIRED: false
      comment: Output only. If the file has been explicitly trashed, the user who trashed it. Only populated for items in shared drives.
    - name: version
      type: STRING
      REQUIRED: false
      comment: Output only. A monotonically increasing version number for the file. This reflects every change made to the file on the server, even those not visible to the user.
    - name: videoMediaMetadata
      type: OBJECT
      REQUIRED: false
      comment: Output only. Additional metadata about video media. This may not be available immediately upon upload.
    - name: viewedByMe
      type: BOOL
      REQUIRED: false
      comment: Output only. Whether the file has been viewed by this user.
    - name: viewedByMeTime
      type: TIMESTAMP
      REQUIRED: false
      comment: The last time the file was viewed by the user (RFC 3339 date-time).
    - name: viewersCanCopyContent
      type: BOOL
      REQUIRED: false
      comment: "Deprecated: Use `copyRequiresWriterPermission` instead."
    - name: webContentLink
      type: STRING
      REQUIRED: false
      comment: Output only. A link for downloading the content of the file in a browser. This is only available for files with binary content in Google Drive.
    - name: webViewLink
      type: STRING
      REQUIRED: false
      comment: Output only. A link for opening the file in a relevant Google editor or viewer in a browser.
    - name: writersCanShare
      type: BOOL
      REQUIRED: false
      comment: Whether users with only `writer` permission can modify the file's permissions. Not populated for items in shared drives.
  ClientEncryptionDetails:
    - name: decryptionMetadata
      type: STRUCT(DecryptionMetadata)
      REQUIRED: false
      comment: The metadata used for client-side operations.
    - name: encryptionState
      type: STRING
      REQUIRED: false
      comment: "The encryption state of the file. The values expected here are: - encrypted - unencrypted "
  DecryptionMetadata:
    - name: aes256GcmChunkSize
      type: STRING
      REQUIRED: false
      comment: "Chunk size used if content was encrypted with the AES 256 GCM Cipher. Possible values are: - default - small "
    - name: encryptionResourceKeyHash
      type: STRING
      REQUIRED: false
      comment: The URL-safe Base64 encoded HMAC-SHA256 digest of the resource metadata with its DEK (Data Encryption Key); see https://developers.google.com/workspace/cse/reference
    - name: jwt
      type: STRING
      REQUIRED: false
      comment: The signed JSON Web Token (JWT) which can be used to authorize the requesting user with the Key ACL Service (KACLS). The JWT asserts that the requesting user has at least read permissions on the file.
    - name: kaclsId
      type: STRING
      REQUIRED: false
      comment: The ID of the KACLS (Key ACL Service) used to encrypt the file.
    - name: kaclsName
      type: STRING
      REQUIRED: false
      comment: The name of the KACLS (Key ACL Service) used to encrypt the file.
    - name: keyFormat
      type: STRING
      REQUIRED: false
      comment: Key format for the unwrapped key. Must be `tinkAesGcmKey`.
    - name: wrappedKey
      type: STRING
      REQUIRED: false
      comment: The URL-safe Base64 encoded wrapped key used to encrypt the contents of the file.
  ContentRestriction:
    - name: ownerRestricted
      type: BOOL
      REQUIRED: false
      comment: Whether the content restriction can only be modified or removed by a user who owns the file. For files in shared drives, any user with `organizer` capabilities can modify or remove this content restriction.
    - name: readOnly
      type: BOOL
      REQUIRED: false
      comment: Whether the content of the file is read-only. If a file is read-only, a new revision of the file may not be added, comments may not be added or modified, and the title of the file may not be modified.
    - name: reason
      type: STRING
      REQUIRED: false
      comment: Reason for why the content of the file is restricted. This is only mutable on requests that also set `readOnly=true`.
    - name: restrictingUser
      type: STRUCT(User)
      REQUIRED: false
      comment: Output only. The user who set the content restriction. Only populated if `readOnly=true`.
    - name: restrictionTime
      type: TIMESTAMP
      REQUIRED: false
      comment: The time at which the content restriction was set (formatted RFC 3339 timestamp). Only populated if readOnly is true.
    - name: systemRestricted
      type: BOOL
      REQUIRED: false
      comment: Output only. Whether the content restriction was applied by the system, for example due to an esignature. Users cannot modify or remove system restricted content restrictions.
    - name: type
      type: STRING
      REQUIRED: false
      comment: Output only. The type of the content restriction. Currently the only possible value is `globalContentRestriction`.
  DownloadRestrictionsMetadata:
    - name: effectiveDownloadRestrictionWithContext
      type: STRUCT(DownloadRestriction)
      REQUIRED: false
      comment: Output only. The effective download restriction applied to this file. This considers all restriction settings and DLP rules.
    - name: itemDownloadRestriction
      type: STRUCT(DownloadRestriction)
      REQUIRED: false
      comment: The download restriction of the file applied directly by the owner or organizer. This doesn't take into account shared drive settings or DLP rules.
  Label:
    - name: fields
      type: map[STRING]ANY
      REQUIRED: false
      comment: A map of the fields on the label, keyed by the field's ID.
    - name: id
      type: STRING
      REQUIRED: false
      comment: The ID of the label.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: This is always drive#label
    - name: revisionId
      type: STRING
      REQUIRED: false
      comment: The revision ID of the label.
  Permission:
    - name: allowFileDiscovery
      type: BOOL
      REQUIRED: false
      comment: Whether the permission allows the file to be discovered through search. This is only applicable for permissions of type `domain` or `anyone`.
    - name: deleted
      type: BOOL
      REQUIRED: false
      comment: Output only. Whether the account associated with this permission has been deleted. This field only pertains to permissions of type `user` or `group`.
    - name: displayName
      type: STRING
      REQUIRED: false
      comment: "Output only. The \"pretty\" name of the value of the permission. The following is a list of examples for each type of permission: * `user` - User's full name, as defined for their Google Account, such as \"Dana A.\" * `group` - Name of the Google Group, such as \"The Company Administrators.\" * `domain` - String domain name, such as \"cymbalgroup.com.\" * `anyone` - No `displayName` is present."
    - name: domain
      type: STRING
      REQUIRED: false
      comment: Output only. The domain to which this permission refers.
    - name: emailAddress
      type: STRING
      REQUIRED: false
      comment: Output only. The email address of the user or group to which this permission refers.
    - name: expirationTime
      type: TIMESTAMP
      REQUIRED: false
      comment: "The time at which this permission will expire (RFC 3339 date-time). Expiration times have the following restrictions: - They can only be set on user and group permissions - The time must be in the future - The time cannot be more than a year in the future"
    - name: id
      type: STRING
      REQUIRED: false
      comment: Output only. The ID of this permission. This is a unique identifier for the grantee, and is published in the [User resource](https://developers.google.com/workspace/drive/api/reference/rest/v3/User) as `permissionId`. IDs should be treated as opaque values.
    - name: inheritedPermissionsDisabled
      type: BOOL
      REQUIRED: false
      comment: When `true`, only organizers, owners, and users with permissions added directly on the item can access it.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: "Output only. Identifies what kind of resource this is. Value: the fixed string `\"drive#permission\"`."
    - name: pendingOwner
      type: BOOL
      REQUIRED: false
      comment: Whether the account associated with this permission is a pending owner. Only populated for permissions of type `user` for files that aren't in a shared drive.
    - name: permissionDetails
      type: "[]ANY"
      REQUIRED: false
      comment: Output only. Details of whether the permissions on this item are inherited or are directly on this item.
    - name: photoLink
      type: STRING
      REQUIRED: false
      comment: Output only. A link to the user's profile photo, if available.
    - name: role
      type: STRING
      REQUIRED: false
      comment: "The role granted by this permission. Supported values include: * `owner` * `organizer` * `fileOrganizer` * `writer` * `commenter` * `reader` For more information, see [Roles and permissions](https://developers.google.com/workspace/drive/api/guides/ref-roles)."
    - name: teamDrivePermissionDetails
      type: "[]ANY"
      REQUIRED: false
      comment: "Output only. Deprecated: Output only. Use `permissionDetails` instead."
    - name: type
      type: STRING
      REQUIRED: false
      comment: "The type of the grantee. Supported values include: * `user` * `group` * `domain` * `anyone` When creating a permission, if `type` is `user` or `group`, you must provide an `emailAddress` for the user or group. If `type` is `domain`, you must provide a `domain`. If `type` is `anyone`, no extra information is required."
    - name: view
      type: STRING
      REQUIRED: false
      comment: "Indicates the view for this permission. Only populated for permissions that belong to a view. The only supported values are `published` and `metadata`: * `published`: The permission's role is `publishedReader`. * `metadata`: The item is only visible to the `metadata` view because the item has limited access and the scope has at least read access to the parent. The `metadata` view is only supported on folders. For more information, see [Views](https://developers.google.com/workspace/drive/api/guides/ref-roles#views)."
  TeamDrive:
    - name: backgroundImageFile
      type: OBJECT
      REQUIRED: false
      comment: The background image file for a Team Drive.
    - name: backgroundImageLink
      type: STRING
      REQUIRED: false
      comment: A short-lived link to this Team Drive's background image.
    - name: capabilities
      type: OBJECT
      REQUIRED: false
      comment: Capabilities the current user has on this Team Drive.
    - name: colorRgb
      type: STRING
      REQUIRED: false
      comment: The color of this Team Drive as an RGB hex string. It can only be set on a `drive.teamdrives.update` request that does not set `themeId`.
    - name: createdTime
      type: TIMESTAMP
      REQUIRED: false
      comment: The time at which the Team Drive was created (RFC 3339 date-time).
    - name: id
      type: STRING
      REQUIRED: false
      comment: The ID of this Team Drive which is also the ID of the top level folder of this Team Drive.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: "Identifies what kind of resource this is. Value: the fixed string `\"drive#teamDrive\"`."
    - name: name
      type: STRING
      REQUIRED: false
      comment: The name of this Team Drive.
    - name: orgUnitId
      type: STRING
      REQUIRED: false
      comment: The organizational unit of this shared drive. This field is only populated on `drives.list` responses when the `useDomainAdminAccess` parameter is set to `true`.
    - name: restrictions
      type: OBJECT
      REQUIRED: false
      comment: A set of restrictions that apply to this Team Drive or items inside this Team Drive.
    - name: themeId
      type: STRING
      REQUIRED: false
      comment: The ID of the theme from which the background image and color will be set. The set of possible `teamDriveThemes` can be retrieved from a `drive.about.get` response. When not specified on a `drive.teamdrives.create` request, a random theme is chosen from which the background image and color are set. This is a write-only field; it can only be set on requests that don't set `colorRgb` or `backgroundImageFile`.
  ChangeList:
    - name: changes
      type: "[]STRUCT(Change)"
      REQUIRED: false
      comment: The list of changes. If nextPageToken is populated, then this list may be incomplete and an additional page of results should be fetched.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: "Identifies what kind of resource this is. Value: the fixed string `\"drive#changeList\"`."
    - name: newStartPageToken
      type: STRING
      REQUIRED: false
      comment: The starting page token for future changes. This will be present only if the end of the current changes list has been reached. The page token doesn't expire.
    - name: nextPageToken
      type: STRING
      REQUIRED: false
      comment: The page token for the next page of changes. This will be absent if the end of the changes list has been reached. The page token doesn't expire.
  Channel:
    - name: address
      type: STRING
      REQUIRED: false
      comment: The address where notifications are delivered for this channel.
    - name: expiration
      type: STRING
      REQUIRED: false
      comment: Date and time of notification channel expiration, expressed as a Unix timestamp, in milliseconds. Optional.
    - name: id
      type: STRING
      REQUIRED: false
      comment: A UUID or similar unique string that identifies this channel.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: Identifies this as a notification channel used to watch for changes to a resource, which is `api#channel`.
    - name: params
      type: map[STRING]STRING
      REQUIRED: false
      comment: Additional parameters controlling delivery channel behavior. Optional.
    - name: payload
      type: BOOL
      REQUIRED: false
      comment: A Boolean value to indicate whether payload is wanted. Optional.
    - name: resourceId
      type: STRING
      REQUIRED: false
      comment: An opaque ID that identifies the resource being watched on this channel. Stable across different API versions.
    - name: resourceUri
      type: STRING
      REQUIRED: false
      comment: A version-specific identifier for the watched resource.
    - name: token
      type: STRING
      REQUIRED: false
      comment: An arbitrary string delivered to the target address with each notification delivered over this channel. Optional.
    - name: type
      type: STRING
      REQUIRED: false
      comment: The type of delivery mechanism used for this channel. Valid values are "web_hook" or "webhook".
  Comment:
    - name: anchor
      type: STRING
      REQUIRED: false
      comment: A region of the document represented as a JSON string. For details on defining anchor properties, refer to [Manage comments and replies](https://developers.google.com/workspace/drive/api/v3/manage-comments).
    - name: assigneeEmailAddress
      type: STRING
      REQUIRED: false
      comment: Output only. The email address of the user assigned to this comment. If no user is assigned, the field is unset.
    - name: author
      type: STRUCT(User)
      REQUIRED: false
      comment: Output only. The author of the comment. The author's email address and permission ID will not be populated.
    - name: content
      type: STRING
      REQUIRED: false
      comment: The plain text content of the comment. This field is used for setting the content, while `htmlContent` should be displayed.
    - name: createdTime
      type: TIMESTAMP
      REQUIRED: false
      comment: The time at which the comment was created (RFC 3339 date-time).
    - name: deleted
      type: BOOL
      REQUIRED: false
      comment: Output only. Whether the comment has been deleted. A deleted comment has no content.
    - name: htmlContent
      type: STRING
      REQUIRED: false
      comment: Output only. The content of the comment with HTML formatting.
    - name: id
      type: STRING
      REQUIRED: false
      comment: Output only. The ID of the comment.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: "Output only. Identifies what kind of resource this is. Value: the fixed string `\"drive#comment\"`."
    - name: mentionedEmailAddresses
      type: "[]STRING"
      REQUIRED: false
      comment: Output only. A list of email addresses for users mentioned in this comment. If no users are mentioned, the list is empty.
    - name: modifiedTime
      type: TIMESTAMP
      REQUIRED: false
      comment: The last time the comment or any of its replies was modified (RFC 3339 date-time).
    - name: quotedFileContent
      type: OBJECT
      REQUIRED: false
      comment: The file content to which the comment refers, typically within the anchor region. For a text file, for example, this would be the text at the location of the comment.
    - name: replies
      type: "[]STRUCT(Reply)"
      REQUIRED: false
      comment: Output only. The full list of replies to the comment in chronological order.
    - name: resolved
      type: BOOL
      REQUIRED: false
      comment: Output only. Whether the comment has been resolved by one of its replies.
  Reply:
    - name: action
      type: STRING
      REQUIRED: false
      comment: "The action the reply performed to the parent comment. The supported values are: * `resolve` * `reopen`"
    - name: assigneeEmailAddress
      type: STRING
      REQUIRED: false
      comment: Output only. The email address of the user assigned to this comment. If no user is assigned, the field is unset.
    - name: author
      type: STRUCT(User)
      REQUIRED: false
      comment: Output only. The author of the reply. The author's email address and permission ID won't be populated.
    - name: content
      type: STRING
      REQUIRED: false
      comment: The plain text content of the reply. This field is used for setting the content, while `htmlContent` should be displayed. This field is required by the `create` method if no `action` value is specified.
    - name: createdTime
      type: TIMESTAMP
      REQUIRED: false
      comment: The time at which the reply was created (RFC 3339 date-time).
    - name: deleted
      type: BOOL
      REQUIRED: false
      comment: Output only. Whether the reply has been deleted. A deleted reply has no content.
    - name: htmlContent
      type: STRING
      REQUIRED: false
      comment: Output only. The content of the reply with HTML formatting.
    - name: id
      type: STRING
      REQUIRED: false
      comment: Output only. The ID of the reply.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: "Output only. Identifies what kind of resource this is. Value: the fixed string `\"drive#reply\"`."
    - name: mentionedEmailAddresses
      type: "[]STRING"
      REQUIRED: false
