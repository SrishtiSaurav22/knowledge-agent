        TYPE: STRUCT(TeamDrive)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - access_token:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - callback:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - key:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - oauth_token:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - prettyPrint:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
      - uploadType:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - $.xgafv:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - alt:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - quotaUser:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - fields:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - upload_protocol:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - teamDriveId:
          TYPE: STRING
          LOCATION: path
      - useDomainAdminAccess:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
      - body:
          TYPE: STRUCT(TeamDrive)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(TeamDrive)
        RETURNVAR: drive_teamdrive_update
        STATUS: 200
    CANONICAL_ID: drive.teamdrive.update
STRUCTS:
  About:
    - name: additionalRoleInfo
      type: "[]ANY"
      REQUIRED: false
      comment: Information about supported additional roles per file type. The most specific type takes precedence.
    - name: canCreateDrives
      type: BOOL
      REQUIRED: false
      comment: Whether the user can create shared drives.
    - name: canCreateTeamDrives
      type: BOOL
      REQUIRED: false
      comment: "Deprecated: Use `canCreateDrives` instead."
    - name: domainSharingPolicy
      type: STRING
      REQUIRED: false
      comment: "Deprecated: Does not granularly represent allowlisted domains or Trust Rules. The domain sharing policy for the current user. Possible values are: * `allowed` * `allowedWithWarning` * `incomingOnly` * `disallowed` Note that if the user is enrolled in Trust Rules, `disallowed` will always be returned. If sharing is restricted to allowlisted domains, either `incomingOnly` or `allowedWithWarning` will be returned, depending on whether receiving files from outside the allowlisted domains is permitted."
    - name: driveThemes
      type: "[]ANY"
      REQUIRED: false
      comment: A list of themes that are supported for shared drives.
    - name: etag
      type: STRING
      REQUIRED: false
      comment: The ETag of the item.
    - name: exportFormats
      type: "[]ANY"
      REQUIRED: false
      comment: The allowable export formats.
    - name: features
      type: "[]ANY"
      REQUIRED: false
      comment: List of additional features enabled on this account.
    - name: folderColorPalette
      type: "[]STRING"
      REQUIRED: false
      comment: The palette of allowable folder colors as RGB hex strings.
    - name: importFormats
      type: "[]ANY"
      REQUIRED: false
      comment: The allowable import formats.
    - name: isCurrentAppInstalled
      type: BOOL
      REQUIRED: false
      comment: A boolean indicating whether the authenticated app is installed by the authenticated user.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: This is always `drive#about`.
    - name: languageCode
      type: STRING
      REQUIRED: false
      comment: The user's language or locale code, as defined by BCP 47, with some extensions from Unicode's LDML format (http://www.unicode.org/reports/tr35/).
    - name: largestChangeId
      type: STRING
      REQUIRED: false
      comment: The largest change id.
    - name: maxUploadSizes
      type: "[]ANY"
      REQUIRED: false
      comment: List of max upload sizes for each file type. The most specific type takes precedence.
    - name: name
      type: STRING
      REQUIRED: false
      comment: The name of the current user.
    - name: permissionId
      type: STRING
      REQUIRED: false
      comment: The current user's ID as visible in the permissions collection.
    - name: quotaBytesByService
      type: "[]ANY"
      REQUIRED: false
      comment: The amount of storage quota used by different Google services.
    - name: quotaBytesTotal
      type: STRING
      REQUIRED: false
      comment: The total number of quota bytes. This is only relevant when quotaType is LIMITED.
    - name: quotaBytesUsed
      type: STRING
      REQUIRED: false
      comment: The number of quota bytes used by Google Drive.
    - name: quotaBytesUsedAggregate
      type: STRING
      REQUIRED: false
      comment: The number of quota bytes used by all Google apps (Drive, Picasa, etc.).
    - name: quotaBytesUsedInTrash
      type: STRING
      REQUIRED: false
      comment: The number of quota bytes used by trashed items.
    - name: quotaType
      type: STRING
      REQUIRED: false
      comment: "The type of the user's storage quota. Possible values are: * `LIMITED` * `UNLIMITED`"
    - name: remainingChangeIds
      type: STRING
      REQUIRED: false
      comment: The number of remaining change ids, limited to no more than 2500.
    - name: rootFolderId
      type: STRING
      REQUIRED: false
      comment: The id of the root folder.
    - name: selfLink
      type: STRING
      REQUIRED: false
      comment: A link back to this item.
    - name: teamDriveThemes
      type: "[]ANY"
      REQUIRED: false
      comment: "Deprecated: Use `driveThemes` instead."
    - name: user
      type: STRUCT(User)
      REQUIRED: false
      comment: The authenticated user.
  User:
    - name: displayName
      type: STRING
      REQUIRED: false
      comment: Output only. A plain text displayable name for this user.
    - name: emailAddress
      type: STRING
      REQUIRED: false
      comment: Output only. The email address of the user. This may not be present in certain contexts if the user has not made their email address visible to the requester.
    - name: isAuthenticatedUser
      type: BOOL
      REQUIRED: false
      comment: Output only. Whether this user is the same as the authenticated user for whom the request was made.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: "Output only. Identifies what kind of resource this is. Value: the fixed string `drive#user`."
    - name: permissionId
      type: STRING
      REQUIRED: false
      comment: Output only. The user's ID as visible in Permission resources.
    - name: picture
      type: OBJECT
      REQUIRED: false
      comment: Output only. The user's profile picture.
  App:
    - name: authorized
      type: BOOL
      REQUIRED: false
      comment: Whether the app is authorized to access data on the user's Drive.
    - name: createInFolderTemplate
      type: STRING
      REQUIRED: false
      comment: The template url to create a new file with this app in a given folder. The template will contain {folderId} to be replaced by the folder to create the new file in.
    - name: createUrl
      type: STRING
      REQUIRED: false
      comment: The url to create a new file with this app.
    - name: hasDriveWideScope
      type: BOOL
      REQUIRED: false
      comment: Whether the app has drive-wide scope. An app with drive-wide scope can access all files in the user's drive.
    - name: icons
      type: "[]ANY"
      REQUIRED: false
      comment: The various icons for the app.
    - name: id
      type: STRING
      REQUIRED: false
      comment: The ID of the app.
    - name: installed
      type: BOOL
      REQUIRED: false
      comment: Whether the app is installed.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: This is always `drive#app`.
    - name: longDescription
      type: STRING
      REQUIRED: false
      comment: A long description of the app.
    - name: name
      type: STRING
      REQUIRED: false
      comment: The name of the app.
    - name: objectType
      type: STRING
      REQUIRED: false
      comment: The type of object this app creates (e.g. Chart). If empty, the app name should be used instead.
    - name: openUrlTemplate
      type: STRING
      REQUIRED: false
      comment: The template url for opening files with this app. The template will contain `{ids}` and/or `{exportIds}` to be replaced by the actual file ids. See Open Files for the full documentation.
    - name: primaryFileExtensions
      type: "[]STRING"
      REQUIRED: false
      comment: The list of primary file extensions.
    - name: primaryMimeTypes
      type: "[]STRING"
      REQUIRED: false
      comment: The list of primary mime types.
    - name: productId
      type: STRING
      REQUIRED: false
      comment: The ID of the product listing for this app.
    - name: productUrl
      type: STRING
      REQUIRED: false
      comment: A link to the product listing for this app.
    - name: secondaryFileExtensions
      type: "[]STRING"
      REQUIRED: false
      comment: The list of secondary file extensions.
    - name: secondaryMimeTypes
      type: "[]STRING"
      REQUIRED: false
      comment: The list of secondary mime types.
    - name: shortDescription
      type: STRING
      REQUIRED: false
      comment: A short description of the app.
    - name: supportsCreate
      type: BOOL
      REQUIRED: false
      comment: Whether this app supports creating new objects.
    - name: supportsImport
      type: BOOL
      REQUIRED: false
      comment: Whether this app supports importing from Docs Editors.
    - name: supportsMultiOpen
      type: BOOL
      REQUIRED: false
      comment: Whether this app supports opening more than one file.
    - name: supportsOfflineCreate
      type: BOOL
      REQUIRED: false
      comment: Whether this app supports creating new files when offline.
    - name: useByDefault
      type: BOOL
      REQUIRED: false
      comment: Whether the app is selected as the default handler for the types it supports.
  AppList:
    - name: defaultAppIds
      type: "[]STRING"
      REQUIRED: false
      comment: List of app IDs that the user has specified to use by default. The list is in reverse-priority order (lowest to highest).
    - name: etag
      type: STRING
      REQUIRED: false
      comment: The ETag of the list.
    - name: items
      type: "[]STRUCT(App)"
      REQUIRED: false
      comment: The list of apps.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: This is always `drive#appList`.
    - name: selfLink
      type: STRING
      REQUIRED: false
      comment: A link back to this list.
  Change:
    - name: changeType
      type: STRING
      REQUIRED: false
      comment: The type of the change. Possible values are `file` and `drive`.
    - name: deleted
      type: BOOL
      REQUIRED: false
      comment: Whether the file or shared drive has been removed from this list of changes, for example by deletion or loss of access.
    - name: drive
      type: STRUCT(Drive)
      REQUIRED: false
      comment: The updated state of the shared drive. Present if the changeType is drive, the user is still a member of the shared drive, and the shared drive has not been deleted.
    - name: driveId
      type: STRING
      REQUIRED: false
      comment: The ID of the shared drive associated with this change.
    - name: file
      type: STRUCT(File)
      REQUIRED: false
      comment: The updated state of the file. Present if the type is file and the file has not been removed from this list of changes.
    - name: fileId
      type: STRING
      REQUIRED: false
      comment: The ID of the file associated with this change.
    - name: id
      type: STRING
      REQUIRED: false
      comment: The ID of the change.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: This is always `drive#change`.
    - name: modificationDate
      type: TIMESTAMP
      REQUIRED: false
      comment: The time of this modification.
    - name: selfLink
      type: STRING
      REQUIRED: false
      comment: A link back to this change.
    - name: teamDrive
      type: STRUCT(TeamDrive)
      REQUIRED: false
      comment: "Deprecated: Use `drive` instead."
    - name: teamDriveId
      type: STRING
      REQUIRED: false
      comment: "Deprecated: Use `driveId` instead."
    - name: type
      type: STRING
      REQUIRED: false
      comment: "Deprecated: Use `changeType` instead."
  Drive:
    - name: backgroundImageFile
      type: OBJECT
      REQUIRED: false
      comment: An image file and cropping parameters from which a background image for this shared drive is set. This is a write only field; it can only be set on `drive.drives.update` requests that don't set `themeId`. When specified, all fields of the `backgroundImageFile` must be set.
    - name: backgroundImageLink
      type: STRING
      REQUIRED: false
      comment: Output only. A short-lived link to this shared drive's background image.
    - name: capabilities
      type: OBJECT
      REQUIRED: false
      comment: Output only. Capabilities the current user has on this shared drive.
    - name: colorRgb
      type: STRING
      REQUIRED: false
      comment: The color of this shared drive as an RGB hex string. It can only be set on a `drive.drives.update` request that does not set `themeId`.
    - name: createdDate
      type: TIMESTAMP
      REQUIRED: false
      comment: The time at which the shared drive was created (RFC 3339 date-time).
    - name: hidden
      type: BOOL
      REQUIRED: false
      comment: Whether the shared drive is hidden from default view.
    - name: id
      type: STRING
      REQUIRED: false
      comment: Output only. The ID of this shared drive which is also the ID of the top level folder of this shared drive.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: Output only. This is always `drive#drive`
    - name: name
      type: STRING
      REQUIRED: false
      comment: The name of this shared drive.
    - name: orgUnitId
      type: STRING
      REQUIRED: false
      comment: Output only. The organizational unit of this shared drive. This field is only populated on `drives.list` responses when the `useDomainAdminAccess` parameter is set to `true`.
    - name: restrictions
      type: OBJECT
      REQUIRED: false
      comment: A set of restrictions that apply to this shared drive or items inside this shared drive.
    - name: themeId
      type: STRING
      REQUIRED: false
      comment: The ID of the theme from which the background image and color will be set. The set of possible `driveThemes` can be retrieved from a `drive.about.get` response. When not specified on a `drive.drives.insert` request, a random theme is chosen from which the background image and color are set. This is a write-only field; it can only be set on requests that don't set `colorRgb` or `backgroundImageFile`.
  File:
    - name: alternateLink
      type: STRING
      REQUIRED: false
      comment: Output only. A link for opening the file in a relevant Google editor or viewer.
    - name: appDataContents
      type: BOOL
      REQUIRED: false
      comment: Output only. Whether this file is in the Application Data folder.
    - name: canComment
      type: BOOL
      REQUIRED: false
      comment: "Output only. Deprecated: Use `capabilities/canComment` instead."
    - name: canReadRevisions
      type: BOOL
      REQUIRED: false
      comment: "Output only. Deprecated: Use `capabilities/canReadRevisions` instead."
    - name: capabilities
      type: OBJECT
      REQUIRED: false
      comment: Output only. Capabilities the current user has on this file. Each capability corresponds to a fine-grained action that a user may take.
    - name: clientEncryptionDetails
      type: STRUCT(ClientEncryptionDetails)
      REQUIRED: false
      comment: Client Side Encryption related details. Contains details about the encryption state of the file and details regarding the encryption mechanism that clients need to use when decrypting the contents of this item. This will only be present on files and not on folders or shortcuts.
    - name: contentRestrictions
      type: "[]STRUCT(ContentRestriction)"
      REQUIRED: false
      comment: Restrictions for accessing the content of the file. Only populated if such a restriction exists.
    - name: copyRequiresWriterPermission
      type: BOOL
      REQUIRED: false
      comment: Whether the options to copy, print, or download this file, should be disabled for readers and commenters.
    - name: copyable
      type: BOOL
      REQUIRED: false
      comment: "Output only. Deprecated: Use `capabilities/canCopy` instead."
    - name: createdDate
      type: TIMESTAMP
      REQUIRED: false
      comment: Create time for this file (formatted RFC 3339 timestamp).
    - name: defaultOpenWithLink
      type: STRING
      REQUIRED: false
      comment: Output only. A link to open this file with the user's default app for this file. Only populated when the drive.apps.readonly scope is used.
    - name: description
      type: STRING
      REQUIRED: false
      comment: A short description of the file.
    - name: downloadUrl
      type: STRING
      REQUIRED: false
      comment: Output only. Short lived download URL for the file. This field is only populated for files with content stored in Google Drive; it is not populated for Google Docs or shortcut files.
    - name: driveId
      type: STRING
      REQUIRED: false
      comment: Output only. ID of the shared drive the file resides in. Only populated for items in shared drives.
    - name: editable
      type: BOOL
      REQUIRED: false
      comment: "Output only. Deprecated: Use `capabilities/canEdit` instead."
    - name: embedLink
      type: STRING
      REQUIRED: false
      comment: Output only. A link for embedding the file.
    - name: etag
      type: STRING
      REQUIRED: false
      comment: Output only. ETag of the file.
    - name: explicitlyTrashed
      type: BOOL
      REQUIRED: false
      comment: Output only. Whether this file has been explicitly trashed, as opposed to recursively trashed.
    - name: exportLinks
      type: map[STRING]STRING
      REQUIRED: false
      comment: Output only. Links for exporting Docs Editors files to specific formats.
    - name: fileExtension
      type: STRING
      REQUIRED: false
      comment: Output only. The final component of `fullFileExtension` with trailing text that does not appear to be part of the extension removed. This field is only populated for files with content stored in Google Drive; it is not populated for Docs Editors or shortcut files.
    - name: fileSize
      type: STRING
      REQUIRED: false
      comment: Output only. Size in bytes of blobs and first party editor files. Won't be populated for files that have no size, like shortcuts and folders.
    - name: folderColorRgb
      type: STRING
      REQUIRED: false
      comment: Folder color as an RGB hex string if the file is a folder or a shortcut to a folder. The list of supported colors is available in the folderColorPalette field of the About resource. If an unsupported color is specified, it will be changed to the closest color in the palette.
    - name: fullFileExtension
      type: STRING
      REQUIRED: false
      comment: Output only. The full file extension; extracted from the title. May contain multiple concatenated extensions, such as "tar.gz". Removing an extension from the title does not clear this field; however, changing the extension on the title does update this field. This field is only populated for files with content stored in Google Drive; it is not populated for Docs Editors or shortcut files.
    - name: hasAugmentedPermissions
      type: BOOL
      REQUIRED: false
      comment: Output only. Whether there are permissions directly on this file. This field is only populated for items in shared drives.
    - name: hasThumbnail
      type: BOOL
      REQUIRED: false
      comment: Output only. Whether this file has a thumbnail. This does not indicate whether the requesting app has access to the thumbnail. To check access, look for the presence of the thumbnailLink field.
    - name: headRevisionId
      type: STRING
      REQUIRED: false
      comment: Output only. The ID of the file's head revision. This field is only populated for files with content stored in Google Drive; it is not populated for Docs Editors or shortcut files.
    - name: iconLink
      type: STRING
      REQUIRED: false
      comment: Output only. A link to the file's icon.
    - name: id
      type: STRING
      REQUIRED: false
      comment: The ID of the file.
    - name: imageMediaMetadata
      type: OBJECT
      REQUIRED: false
      comment: Output only. Metadata about image media. This will only be present for image types, and its contents will depend on what can be parsed from the image content.
    - name: indexableText
      type: OBJECT
      REQUIRED: false
      comment: Indexable text attributes for the file (can only be written)
    - name: inheritedPermissionsDisabled
      type: BOOL
      REQUIRED: false
      comment: Whether this file has inherited permissions disabled. Inherited permissions are enabled by default.
    - name: isAppAuthorized
      type: BOOL
      REQUIRED: false
      comment: Output only. Whether the file was created or opened by the requesting app.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: Output only. The type of file. This is always `drive#file`.
    - name: labelInfo
      type: OBJECT
      REQUIRED: false
      comment: Output only. An overview of the labels on the file.
    - name: labels
      type: OBJECT
      REQUIRED: false
      comment: A group of labels for the file.
    - name: lastModifyingUser
      type: STRUCT(User)
      REQUIRED: false
      comment: Output only. The last user to modify this file. This field is only populated when the last modification was performed by a signed-in user.
    - name: lastModifyingUserName
      type: STRING
      REQUIRED: false
      comment: Output only. Name of the last user to modify this file.
    - name: lastViewedByMeDate
      type: TIMESTAMP
      REQUIRED: false
      comment: Last time this file was viewed by the user (formatted RFC 3339 timestamp).
    - name: linkShareMetadata
      type: OBJECT
      REQUIRED: false
      comment: Contains details about the link URLs that clients are using to refer to this item.
    - name: markedViewedByMeDate
      type: TIMESTAMP
      REQUIRED: false
      comment: Deprecated.
    - name: md5Checksum
      type: STRING
      REQUIRED: false
      comment: Output only. An MD5 checksum for the content of this file. This field is only populated for files with content stored in Google Drive; it is not populated for Docs Editors or shortcut files.
    - name: mimeType
      type: STRING
      REQUIRED: false
      comment: The MIME type of the file. This is only mutable on update when uploading new content. This field can be left blank, and the mimetype will be determined from the uploaded content's MIME type.
    - name: modifiedByMeDate
      type: TIMESTAMP
      REQUIRED: false
      comment: Last time this file was modified by the user (formatted RFC 3339 timestamp). Note that setting modifiedDate will also update the modifiedByMe date for the user which set the date.
    - name: modifiedDate
      type: TIMESTAMP
      REQUIRED: false
      comment: Last time this file was modified by anyone (formatted RFC 3339 timestamp). This is only mutable on update when the setModifiedDate parameter is set.
    - name: openWithLinks
      type: map[STRING]STRING
      REQUIRED: false
      comment: Output only. A map of the id of each of the user's apps to a link to open this file with that app. Only populated when the drive.apps.readonly scope is used.
    - name: originalFilename
      type: STRING
      REQUIRED: false
      comment: The original filename of the uploaded content if available, or else the original value of the `title` field. This is only available for files with binary content in Google Drive.
    - name: ownedByMe
      type: BOOL
      REQUIRED: false
      comment: Output only. Whether the file is owned by the current user. Not populated for items in shared drives.
    - name: ownerNames
      type: "[]STRING"
      REQUIRED: false
      comment: Output only. Name(s) of the owner(s) of this file. Not populated for items in shared drives.
    - name: owners
      type: "[]STRUCT(User)"
      REQUIRED: false
      comment: Output only. The owner of this file. Only certain legacy files may have more than one owner. This field isn't populated for items in shared drives.
    - name: parents
      type: "[]STRUCT(ParentReference)"
      REQUIRED: false
      comment: The ID of the parent folder containing the file. A file can only have one parent folder; specifying multiple parents isn't supported. If not specified as part of an insert request, the file is placed directly in the user's My Drive folder. If not specified as part of a copy request, the file inherits any discoverable parent of the source file. Update requests must use the `addParents` and `removeParents` parameters to modify the parents list.
    - name: permissionIds
      type: "[]STRING"
      REQUIRED: false
      comment: Output only. List of permission IDs for users with access to this file.
    - name: permissions
      type: "[]STRUCT(Permission)"
      REQUIRED: false
      comment: Output only. The list of permissions for users with access to this file. Not populated for items in shared drives.
    - name: properties
      type: "[]STRUCT(Property)"
      REQUIRED: false
      comment: The list of properties.
    - name: quotaBytesUsed
      type: STRING
      REQUIRED: false
      comment: Output only. The number of quota bytes used by this file.
    - name: resourceKey
      type: STRING
      REQUIRED: false
      comment: Output only. A key needed to access the item via a shared link.
    - name: selfLink
      type: STRING
      REQUIRED: false
      comment: Output only. A link back to this file.
    - name: sha1Checksum
      type: STRING
      REQUIRED: false
      comment: Output only. The SHA1 checksum associated with this file, if available. This field is only populated for files with content stored in Google Drive; it is not populated for Docs Editors or shortcut files.
    - name: sha256Checksum
      type: STRING
      REQUIRED: false
      comment: Output only. The SHA256 checksum associated with this file, if available. This field is only populated for files with content stored in Google Drive; it is not populated for Docs Editors or shortcut files.
    - name: shareable
      type: BOOL
      REQUIRED: false
      comment: "Output only. Deprecated: Use `capabilities/canShare` instead."
    - name: shared
      type: BOOL
      REQUIRED: false
      comment: Output only. Whether the file has been shared. Not populated for items in shared drives.
    - name: sharedWithMeDate
      type: TIMESTAMP
      REQUIRED: false
      comment: Time at which this file was shared with the user (formatted RFC 3339 timestamp).
    - name: sharingUser
      type: STRUCT(User)
      REQUIRED: false
      comment: Output only. User that shared the item with the current user, if available.
    - name: shortcutDetails
      type: OBJECT
      REQUIRED: false
      comment: Shortcut file details. Only populated for shortcut files, which have the mimeType field set to `application/vnd.google-apps.shortcut`. Can only be set on `files.insert` requests.
    - name: spaces
      type: "[]STRING"
      REQUIRED: false
      comment: Output only. The list of spaces which contain the file. Supported values are `drive`, `appDataFolder` and `photos`.
    - name: teamDriveId
      type: STRING
      REQUIRED: false
      comment: "Output only. Deprecated: Use `driveId` instead."
    - name: thumbnail
      type: OBJECT
      REQUIRED: false
      comment: A thumbnail for the file. This will only be used if a standard thumbnail cannot be generated.
    - name: thumbnailLink
      type: STRING
      REQUIRED: false
      comment: Output only. A short-lived link to the file's thumbnail, if available. Typically lasts on the order of hours. Not intended for direct usage on web applications due to [Cross-Origin Resource Sharing (CORS)](https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS), consider using a proxy server. Only populated when the requesting app can access the file's content. If the file isn't shared publicly, the URL returned in `Files.thumbnailLink` must be fetched using a credentialed request.
    - name: thumbnailVersion
      type: STRING
      REQUIRED: false
      comment: Output only. The thumbnail version for use in thumbnail cache invalidation.
    - name: title
      type: STRING
      REQUIRED: false
      comment: The title of this file. Note that for immutable items such as the top level folders of shared drives, My Drive root folder, and Application Data folder the title is constant.
    - name: trashedDate
      type: TIMESTAMP
      REQUIRED: false
      comment: The time that the item was trashed (formatted RFC 3339 timestamp). Only populated for items in shared drives.
    - name: trashingUser
      type: STRUCT(User)
      REQUIRED: false
      comment: Output only. If the file has been explicitly trashed, the user who trashed it. Only populated for items in shared drives.
    - name: userPermission
      type: STRUCT(Permission)
      REQUIRED: false
      comment: Output only. The permissions for the authenticated user on this file.
    - name: version
      type: STRING
      REQUIRED: false
      comment: Output only. A monotonically increasing version number for the file. This reflects every change made to the file on the server, even those not visible to the requesting user.
    - name: videoMediaMetadata
      type: OBJECT
      REQUIRED: false
      comment: Output only. Metadata about video media. This will only be present for video types.
    - name: webContentLink
      type: STRING
      REQUIRED: false
      comment: Output only. A link for downloading the content of the file in a browser using cookie based authentication. In cases where the content is shared publicly, the content can be downloaded without any credentials.
    - name: webViewLink
      type: STRING
      REQUIRED: false
      comment: Output only. A link only available on public folders for viewing their static web assets (HTML, CSS, JS, etc) via Google Drive's Website Hosting.
    - name: writersCanShare
      type: BOOL
      REQUIRED: false
      comment: Whether writers can share the document with other users. Not populated for items in shared drives.
  ClientEncryptionDetails:
    - name: decryptionMetadata
      type: STRUCT(DecryptionMetadata)
      REQUIRED: false
      comment: The metadata used for client-side operations.
    - name: encryptionState
      type: STRING
      REQUIRED: false
      comment: "The encryption state of the file. The values expected here are: - encrypted - unencrypted "
  DecryptionMetadata:
    - name: aes256GcmChunkSize
      type: STRING
      REQUIRED: false
      comment: "Chunk size used if content was encrypted with the AES 256 GCM Cipher. Possible values are: - default - small "
    - name: encryptionResourceKeyHash
      type: STRING
      REQUIRED: false
      comment: The URL-safe Base64 encoded HMAC-SHA256 digest of the resource metadata with its DEK (Data Encryption Key); see https://developers.google.com/workspace/cse/reference
    - name: jwt
      type: STRING
      REQUIRED: false
      comment: The signed JSON Web Token (JWT) which can be used to authorize the requesting user with the Key ACL Service (KACLS). The JWT asserts that the requesting user has at least read permissions on the file.
    - name: kaclsId
      type: STRING
      REQUIRED: false
      comment: The ID of the KACLS (Key ACL Service) used to encrypt the file.
    - name: kaclsName
      type: STRING
      REQUIRED: false
      comment: The name of the KACLS (Key ACL Service) used to encrypt the file.
    - name: keyFormat
      type: STRING
      REQUIRED: false
      comment: Key format for the unwrapped key. Must be `tinkAesGcmKey`.
    - name: wrappedKey
      type: STRING
      REQUIRED: false
      comment: The URL-safe Base64 encoded wrapped key used to encrypt the contents of the file.
  ContentRestriction:
    - name: ownerRestricted
      type: BOOL
      REQUIRED: false
      comment: Whether the content restriction can only be modified or removed by a user who owns the file. For files in shared drives, any user with `organizer` capabilities can modify or remove this content restriction.
    - name: readOnly
      type: BOOL
      REQUIRED: false
      comment: Whether the content of the file is read-only. If a file is read-only, a new revision of the file may not be added, comments may not be added or modified, and the title of the file may not be modified.
    - name: reason
      type: STRING
      REQUIRED: false
      comment: Reason for why the content of the file is restricted. This is only mutable on requests that also set `readOnly=true`.
    - name: restrictingUser
      type: STRUCT(User)
      REQUIRED: false
      comment: Output only. The user who set the content restriction. Only populated if `readOnly` is true.
    - name: restrictionDate
      type: TIMESTAMP
      REQUIRED: false
      comment: The time at which the content restriction was set (formatted RFC 3339 timestamp). Only populated if readOnly is true.
    - name: systemRestricted
      type: BOOL
      REQUIRED: false
      comment: Output only. Whether the content restriction was applied by the system, for example due to an esignature. Users cannot modify or remove system restricted content restrictions.
    - name: type
      type: STRING
      REQUIRED: false
      comment: Output only. The type of the content restriction. Currently the only possible value is `globalContentRestriction`.
  Label:
    - name: fields
      type: map[STRING]ANY
      REQUIRED: false
      comment: A map of the fields on the label, keyed by the field's ID.
    - name: id
      type: STRING
      REQUIRED: false
      comment: The ID of the label.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: This is always `drive#label`
    - name: revisionId
      type: STRING
      REQUIRED: false
      comment: The revision ID of the label.
  ParentReference:
    - name: id
      type: STRING
      REQUIRED: false
      comment: The ID of the parent.
    - name: isRoot
      type: BOOL
      REQUIRED: false
      comment: Output only. Whether or not the parent is the root folder.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: Output only. This is always `drive#parentReference`.
    - name: parentLink
      type: STRING
      REQUIRED: false
      comment: Output only. A link to the parent.
    - name: selfLink
      type: STRING
      REQUIRED: false
      comment: Output only. A link back to this reference.
  Permission:
    - name: additionalRoles
      type: "[]STRING"
      REQUIRED: false
      comment: Additional roles for this user. Only `commenter` is currently allowed, though more may be supported in the future.
    - name: authKey
      type: STRING
      REQUIRED: false
      comment: Output only. Deprecated.
    - name: deleted
      type: BOOL
      REQUIRED: false
      comment: Output only. Whether the account associated with this permission has been deleted. This field only pertains to user and group permissions.
    - name: domain
      type: STRING
      REQUIRED: false
      comment: Output only. The domain name of the entity this permission refers to. This is an output-only field which is present when the permission type is `user`, `group` or `domain`.
    - name: emailAddress
      type: STRING
      REQUIRED: false
      comment: Output only. The email address of the user or group this permission refers to. This is an output-only field which is present when the permission type is `user` or `group`.
    - name: etag
      type: STRING
      REQUIRED: false
      comment: Output only. The ETag of the permission.
    - name: expirationDate
      type: TIMESTAMP
      REQUIRED: false
      comment: "The time at which this permission will expire (RFC 3339 date-time). Expiration dates have the following restrictions: - They can only be set on user and group permissions - The date must be in the future - The date cannot be more than a year in the future - The date can only be set on drive.permissions.update or drive.permissions.patch requests"
    - name: id
      type: STRING
      REQUIRED: false
      comment: The ID of the user this permission refers to, and identical to the `permissionId` in the About and Files resources. When making a `drive.permissions.insert` request, exactly one of the `id` or `value` fields must be specified unless the permission type is `anyone`, in which case both `id` and `value` are ignored.
    - name: inheritedPermissionsDisabled
      type: BOOL
      REQUIRED: false
      comment: When true, only organizers, owners, and users with permissions added directly on the item can access it.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: Output only. This is always `drive#permission`.
    - name: name
      type: STRING
      REQUIRED: false
      comment: Output only. The name for this permission.
    - name: pendingOwner
      type: BOOL
      REQUIRED: false
      comment: Whether the account associated with this permission is a pending owner. Only populated for `user` type permissions for files that are not in a shared drive.
    - name: permissionDetails
      type: "[]ANY"
      REQUIRED: false
      comment: Output only. Details of whether the permissions on this item are inherited or directly on this item.
    - name: photoLink
      type: STRING
      REQUIRED: false
      comment: Output only. A link to the profile photo, if available.
    - name: role
      type: STRING
      REQUIRED: false
      comment: "The primary role for this user. While new values may be supported in the future, the following are currently allowed: * `owner` * `organizer` * `fileOrganizer` * `writer` * `reader`"
    - name: selfLink
      type: STRING
      REQUIRED: false
      comment: Output only. A link back to this permission.
    - name: teamDrivePermissionDetails
      type: "[]ANY"
      REQUIRED: false
      comment: "Output only. Deprecated: Use `permissionDetails` instead."
    - name: type
      type: STRING
      REQUIRED: false
      comment: "The account type. Allowed values are: * `user` * `group` * `domain` * `anyone`"
    - name: value
      type: STRING
      REQUIRED: false
      comment: The email address or domain name for the entity. This is used during inserts and is not populated in responses. When making a `drive.permissions.insert` request, exactly one of the `id` or `value` fields must be specified unless the permission type is `anyone`, in which case both `id` and `value` are ignored.
    - name: view
      type: STRING
      REQUIRED: false
      comment: "Indicates the view for this permission. Only populated for permissions that belong to a view. published and metadata are the only supported values. - published: The permission's role is published_reader. - metadata: The item is only visible to the metadata view because the item has limited access and the scope has at least read access to the parent. Note: The metadata view is currently only supported on folders. "
    - name: withLink
      type: BOOL
      REQUIRED: false
      comment: Whether the link is required for this permission.
  Property:
    - name: etag
      type: STRING
      REQUIRED: false
      comment: Output only. ETag of the property.
    - name: key
      type: STRING
      REQUIRED: false
      comment: The key of this property.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: Output only. This is always `drive#property`.
    - name: selfLink
      type: STRING
      REQUIRED: false
      comment: Output only. The link back to this property.
    - name: value
      type: STRING
      REQUIRED: false
      comment: The value of this property.
    - name: visibility
      type: STRING
      REQUIRED: false
      comment: The visibility of this property. Allowed values are PRIVATE (default) and PUBLIC. Private properties can only be retrieved using an authenticated request. An authenticated request uses an access token obtained with a OAuth 2 client ID. You cannot use an API key to retrieve private properties.
  TeamDrive:
    - name: backgroundImageFile
      type: OBJECT
      REQUIRED: false
      comment: An image file and cropping parameters from which a background image for this Team Drive is set. This is a write only field; it can only be set on `drive.teamdrives.update` requests that don't set `themeId`. When specified, all fields of the `backgroundImageFile` must be set.
    - name: backgroundImageLink
      type: STRING
      REQUIRED: false
      comment: A short-lived link to this Team Drive's background image.
    - name: capabilities
      type: OBJECT
      REQUIRED: false
      comment: Capabilities the current user has on this Team Drive.
    - name: colorRgb
      type: STRING
      REQUIRED: false
      comment: The color of this Team Drive as an RGB hex string. It can only be set on a `drive.teamdrives.update` request that does not set `themeId`.
    - name: createdDate
      type: TIMESTAMP
      REQUIRED: false
      comment: The time at which the Team Drive was created (RFC 3339 date-time).
    - name: id
      type: STRING
      REQUIRED: false
      comment: The ID of this Team Drive which is also the ID of the top level folder of this Team Drive.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: This is always `drive#teamDrive`
    - name: name
      type: STRING
      REQUIRED: false
      comment: The name of this Team Drive.
    - name: orgUnitId
      type: STRING
      REQUIRED: false
      comment: The organizational unit of this shared drive. This field is only populated on `drives.list` responses when the `useDomainAdminAccess` parameter is set to `true`.
    - name: restrictions
      type: OBJECT
      REQUIRED: false
      comment: A set of restrictions that apply to this Team Drive or items inside this Team Drive.
    - name: themeId
      type: STRING
      REQUIRED: false
      comment: The ID of the theme from which the background image and color will be set. The set of possible `teamDriveThemes` can be retrieved from a `drive.about.get` response. When not specified on a `drive.teamdrives.insert` request, a random theme is chosen from which the background image and color are set. This is a write-only field; it can only be set on requests that don't set `colorRgb` or `backgroundImageFile`.
  ChangeList:
    - name: etag
      type: STRING
      REQUIRED: false
      comment: The ETag of the list.
    - name: items
      type: "[]STRUCT(Change)"
      REQUIRED: false
      comment: The list of changes. If nextPageToken is populated, then this list may be incomplete and an additional page of results should be fetched.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: This is always `drive#changeList`.
    - name: largestChangeId
      type: STRING
      REQUIRED: false
      comment: The current largest change ID.
    - name: newStartPageToken
      type: STRING
      REQUIRED: false
      comment: The starting page token for future changes. This will be present only if the end of the current changes list has been reached.
    - name: nextLink
      type: STRING
      REQUIRED: false
      comment: A link to the next page of changes.
    - name: nextPageToken
      type: STRING
      REQUIRED: false
      comment: The page token for the next page of changes. This will be absent if the end of the changes list has been reached. If the token is rejected for any reason, it should be discarded, and pagination should be restarted from the first page of results.
    - name: selfLink
      type: STRING
      REQUIRED: false
      comment: A link back to this list.
  Channel:
    - name: address
      type: STRING
      REQUIRED: false
      comment: The address where notifications are delivered for this channel.
    - name: expiration
      type: STRING
      REQUIRED: false
      comment: Date and time of notification channel expiration, expressed as a Unix timestamp, in milliseconds. Optional.
    - name: id
      type: STRING
      REQUIRED: false
      comment: A UUID or similar unique string that identifies this channel.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: Identifies this as a notification channel used to watch for changes to a resource, which is `api#channel`.
    - name: params
      type: map[STRING]STRING
      REQUIRED: false
      comment: Additional parameters controlling delivery channel behavior. Optional.
    - name: payload
      type: BOOL
      REQUIRED: false
      comment: A Boolean value to indicate whether payload is wanted. Optional.
    - name: resourceId
      type: STRING
      REQUIRED: false
      comment: An opaque ID that identifies the resource being watched on this channel. Stable across different API versions.
    - name: resourceUri
      type: STRING
      REQUIRED: false
      comment: A version-specific identifier for the watched resource.
    - name: token
      type: STRING
      REQUIRED: false
      comment: An arbitrary string delivered to the target address with each notification delivered over this channel. Optional.
    - name: type
      type: STRING
      REQUIRED: false
      comment: The type of delivery mechanism used for this channel. Valid values are "web_hook" or "webhook".
  ChildList:
    - name: etag
      type: STRING
      REQUIRED: false
      comment: The ETag of the list.
    - name: items
      type: "[]STRUCT(ChildReference)"
      REQUIRED: false
      comment: The list of children. If nextPageToken is populated, then this list may be incomplete and an additional page of results should be fetched.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: This is always `drive#childList`.
    - name: nextLink
      type: STRING
      REQUIRED: false
      comment: A link to the next page of children.
    - name: nextPageToken
      type: STRING
      REQUIRED: false
      comment: The page token for the next page of children. This will be absent if the end of the children list has been reached. If the token is rejected for any reason, it should be discarded, and pagination should be restarted from the first page of results.
    - name: selfLink
      type: STRING
      REQUIRED: false
      comment: A link back to this list.
  ChildReference:
    - name: childLink
      type: STRING
      REQUIRED: false
      comment: Output only. A link to the child.
    - name: id
      type: STRING
      REQUIRED: false
      comment: The ID of the child.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: Output only. This is always `drive#childReference`.
    - name: selfLink
      type: STRING
      REQUIRED: false
      comment: Output only. A link back to this reference.
  Comment:
    - name: anchor
      type: STRING
      REQUIRED: false
      comment: A region of the document represented as a JSON string. For details on defining anchor properties, refer to [Manage comments and replies](https://developers.google.com/workspace/drive/api/v3/manage-comments).
    - name: author
      type: STRUCT(User)
      REQUIRED: false
      comment: The user who wrote this comment.
    - name: commentId
      type: STRING
      REQUIRED: false
      comment: The ID of the comment.
    - name: content
      type: STRING
      REQUIRED: false
      comment: The plain text content used to create this comment. This is not HTML safe and should only be used as a starting point to make edits to a comment's content.
    - name: context
      type: OBJECT
      REQUIRED: false
      comment: Context of a file which is being commented on.
    - name: createdDate
      type: TIMESTAMP
      REQUIRED: false
      comment: The date when this comment was first created.
    - name: deleted
      type: BOOL
      REQUIRED: false
      comment: Whether this comment has been deleted. If a comment has been deleted the content will be cleared and this will only represent a comment that once existed.
    - name: fileId
      type: STRING
      REQUIRED: false
      comment: The file which this comment is addressing.
    - name: fileTitle
      type: STRING
      REQUIRED: false
      comment: The title of the file which this comment is addressing.
    - name: htmlContent
      type: STRING
      REQUIRED: false
      comment: HTML formatted content for this comment.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: This is always drive#comment.
    - name: modifiedDate
      type: TIMESTAMP
      REQUIRED: false
      comment: The date when this comment or any of its replies were last modified.
    - name: replies
      type: "[]STRUCT(CommentReply)"
      REQUIRED: false
      comment: Replies to this post.
    - name: selfLink
      type: STRING
      REQUIRED: false
      comment: A link back to this comment.
    - name: status
      type: STRING
      REQUIRED: false
      comment: "The status of this comment. Status can be changed by posting a reply to a comment with the desired status. Possible values are: * `open` - The comment is still open. * `resolved` - The comment has been resolved by one of its replies."
  CommentReply:
    - name: author
      type: STRUCT(User)
      REQUIRED: false
      comment: The user who wrote this reply.
    - name: content
      type: STRING
      REQUIRED: false
      comment: The plain text content used to create this reply. This is not HTML safe and should only be used as a starting point to make edits to a reply's content. This field is required on inserts if no verb is specified (resolve/reopen).
    - name: createdDate
      type: TIMESTAMP
      REQUIRED: false
      comment: The date when this reply was first created.
    - name: deleted
      type: BOOL
      REQUIRED: false
      comment: Whether this reply has been deleted. If a reply has been deleted the content will be cleared and this will only represent a reply that once existed.
    - name: htmlContent
      type: STRING
      REQUIRED: false
      comment: HTML formatted content for this reply.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: This is always drive#commentReply.
    - name: modifiedDate
      type: TIMESTAMP
      REQUIRED: false
      comment: The date when this reply was last modified.
    - name: replyId
      type: STRING
      REQUIRED: false
      comment: The ID of the reply.
    - name: verb
      type: STRING
      REQUIRED: false
      comment: "The action this reply performed to the parent comment. When creating a new reply this is the action to be perform tSo the parent comment. Possible values are: * `resolve` - To resolve a comment. * `reopen` - To reopen (un-resolve) a comment."
  CommentList:
    - name: items
      type: "[]STRUCT(Comment)"
      REQUIRED: false
      comment: The list of comments. If nextPageToken is populated, then this list may be incomplete and an additional page of results should be fetched.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: This is always drive#commentList.
    - name: nextLink
      type: STRING
      REQUIRED: false
      comment: A link to the next page of comments.
    - name: nextPageToken
      type: STRING
      REQUIRED: false
      comment: The page token for the next page of comments. This will be absent if the end of the comments list has been reached. If the token is rejected for any reason, it should be discarded, and pagination should be restarted from the first page of results.
    - name: selfLink
      type: STRING
      REQUIRED: false
      comment: A link back to this list.
  CommentReplyList:
    - name: items
      type: "[]STRUCT(CommentReply)"
      REQUIRED: false
      comment: The list of replies. If nextPageToken is populated, then this list may be incomplete and an additional page of results should be fetched.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: This is always `drive#commentReplyList`.
    - name: nextLink
      type: STRING
      REQUIRED: false
      comment: A link to the next page of replies.
    - name: nextPageToken
      type: STRING
      REQUIRED: false
      comment: The page token for the next page of replies. This will be absent if the end of the replies list has been reached. If the token is rejected for any reason, it should be discarded, and pagination should be restarted from the first page of results.
    - name: selfLink
      type: STRING
      REQUIRED: false
      comment: A link back to this list.
  DriveList:
    - name: items
      type: "[]STRUCT(Drive)"
      REQUIRED: false
      comment: The list of shared drives. If nextPageToken is populated, then this list may be incomplete and an additional page of results should be fetched.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: This is always `drive#driveList`
    - name: nextPageToken
      type: STRING
      REQUIRED: false
      comment: The page token for the next page of shared drives. This will be absent if the end of the list has been reached. If the token is rejected for any reason, it should be discarded, and pagination should be restarted from the first page of results.
  FileList:
    - name: etag
      type: STRING
      REQUIRED: false
      comment: The ETag of the list.
    - name: incompleteSearch
      type: BOOL
      REQUIRED: false
      comment: Whether the search process was incomplete. If true, then some search results may be missing, since all documents were not searched. This may occur when searching multiple drives with the "allDrives" corpora, but all corpora could not be searched. When this happens, it is suggested that clients narrow their query by choosing a different corpus such as "default" or "drive".
    - name: items
      type: "[]STRUCT(File)"
      REQUIRED: false
      comment: The list of files. If nextPageToken is populated, then this list may be incomplete and an additional page of results should be fetched.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: This is always `drive#fileList`.
    - name: nextLink
      type: STRING
      REQUIRED: false
      comment: A link to the next page of files.
    - name: nextPageToken
      type: STRING
      REQUIRED: false
      comment: The page token for the next page of files. This will be absent if the end of the files list has been reached. If the token is rejected for any reason, it should be discarded, and pagination should be restarted from the first page of results.
    - name: selfLink
      type: STRING
      REQUIRED: false
      comment: A link back to this list.
  GenerateCseTokenResponse:
    - name: currentKaclsId
      type: STRING
      REQUIRED: false
      comment: The current Key ACL Service (KACLS) ID associated with the JWT.
    - name: currentKaclsName
      type: STRING
      REQUIRED: false
      comment: Name of the KACLs that the returned KACLs ID points to.
    - name: fileId
      type: STRING
      REQUIRED: false
      comment: The fileId for which the JWT was generated.
    - name: jwt
      type: STRING
      REQUIRED: false
      comment: The signed JSON Web Token (JWT) for the file.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: "Output only. Identifies what kind of resource this is. Value: the fixed string `\"drive#generateCseTokenResponse\"`."
  GeneratedIds:
    - name: ids
      type: "[]STRING"
      REQUIRED: false
      comment: The IDs generated for the requesting user in the specified space.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: This is always `drive#generatedIds`
    - name: space
      type: STRING
      REQUIRED: false
      comment: The type of file that can be created with these IDs.
  LabelFieldModification:
    - name: fieldId
      type: STRING
      REQUIRED: false
      comment: The ID of the field to be modified.
    - name: kind
      type: STRING
      REQUIRED: false
      comment: This is always `drive#labelFieldModification`.
    - name: setDateValues
      type: "[]DATE"
      REQUIRED: false
