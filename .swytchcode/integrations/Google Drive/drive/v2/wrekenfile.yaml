      REQUIRED: false
      comment: Whether this revision is published. This is only populated and can only be modified for Docs Editors files.
    - name: publishedLink
      type: STRING
      REQUIRED: false
      comment: Output only. A link to the published revision. This is only populated for Docs Editors files.
    - name: publishedOutsideDomain
      type: BOOL
      REQUIRED: false
      comment: Whether this revision is published outside the domain. This is only populated and can only be modified for Docs Editors files.
    - name: selfLink
      type: STRING
      REQUIRED: false
      comment: Output only. A link back to this revision.
